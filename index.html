<style>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>
<div id="rotate"><div class="ph"></div><h2>Turn your phone sideways</h2><div class="sub" style="margin:0">Emberdeep plays in landscape.<br>On iPhone, tap Share then Add to Home Screen for true full screen.</div></div>
<script>
'use strict';
const BUILD = 8;
// ===== Core: math, seeded randomness, storage =====
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (ax, ay, bx, by) => { const x = bx - ax, y = by - ay; return x * x + y * y; };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// One hash to rule them all: (seed, a, b, salt) -> uint32. Same inputs, same answer, forever.
function hash(a, b = 0, c = 0, d = 0) {
  let h = (a | 0) ^ 0x9E3779B9;
  h = Math.imul(h ^ (b | 0), 0x85EBCA6B); h ^= h >>> 13;
  h = Math.imul(h ^ (c | 0), 0xC2B2AE35); h ^= h >>> 16;
  h = Math.imul(h ^ (d | 0), 0x27D4EB2F); h ^= h >>> 15;
  return h >>> 0;
}
function strHash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

// Small fast PRNG (mulberry32) with helpers
function RNG(seed) {
  let t = seed >>> 0;
  const f = () => {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
  f.int = (a, b) => a + Math.floor(f() * (b - a + 1));
  f.range = (a, b) => a + f() * (b - a);
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  f.weighted = (list, wf) => { let tot = 0; for (const x of list) tot += wf(x); let r = f() * tot; for (const x of list) { r -= wf(x); if (r <= 0) return x; } return list[list.length - 1]; };
  return f;
}
const R = RNG((Math.random() * 4294967296) >>> 0); // unseeded combat randomness

const SEED_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normSeed = s => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
const randomSeed = () => { let s = ''; for (let i = 0; i < 6; i++) s += SEED_CHARS[Math.floor(Math.random() * SEED_CHARS.length)]; return s; };

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

// ===== Phones: fullscreen + landscape lock (Android Chrome; iPhone needs Add to Home Screen) =====
const Screen = {
  touch: matchMedia('(pointer:coarse)').matches,
  goFull() {
    if (!this.touch) return;
    const el = document.documentElement;
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
        if (p && p.then) p.then(() => this.lock()).catch(() => {});
        else this.lock();
      } else this.lock();
    } catch (e) { }
  },
  lock() { try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => {}); } catch (e) { } },
  portrait() { return this.touch && innerHeight > innerWidth; },
};

// ===== Persistent meta (embers, unlocks, saved seeds, secrets) =====
const SAVE_KEY = 'emberdeep.v1';
const Meta = {
  data: { embers: 0, unlocks: {}, seeds: [], secrets: {}, stats: { runs: 0, wins: 0, bestDepth: 0, kills: 0 }, muted: false },
  load() {
    try { const s = localStorage.getItem(SAVE_KEY); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) { }
    this.data.stats = Object.assign({ runs: 0, wins: 0, bestFloor: 0, kills: 0 }, this.data.stats);
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { } },
  has(id) { // campaign heroes have their own Sanctum
    const u = typeof Game !== 'undefined' && Game.mode === 'campaign' && Game.char ? Game.char.unlocks : this.data.unlocks;
    return !!u[id];
  },
};

// ===== Input: keyboard/mouse, touch twin-sticks, gamepads, read through "slots" =====
const Input = {
  keys: new Set(), pressed: new Set(),
  mouse: { x: 0, y: 0, l: false, r: false, rPressed: false },
  last: 'kb', // 'kb' | 'touch' | 'pad'
  sticks: { L: null, R: null }, // touch sticks {id, ox, oy, x, y}
  tbtn: { roll: false, swap: false, use: false, potion: false, relic: false }, // touch button presses this frame
  atk: null, // pointer id holding the touch attack button
  padPrev: [],
  init(canvas) {
    addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (!this.keys.has(k)) this.pressed.add(k);
      this.keys.add(k); this.last = 'kb';
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab'].includes(k)) e.preventDefault();
    });
    addEventListener('keyup', e => this.keys.delete(e.key.toLowerCase()));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.l = this.mouse.r = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('pointerdown', e => {
      Snd.init();
      if (e.pointerType === 'touch') { this.touchDown(e); return; }
      this.last = 'kb';
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      if (e.button === 0) this.mouse.l = true;
      if (e.button === 2) { this.mouse.r = true; this.mouse.rPressed = true; }
    });
    addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') { this.touchMove(e); return; }
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
    });
    const up = e => {
      if (e.pointerType === 'touch') { this.touchUp(e); return; }
      if (e.button === 0) this.mouse.l = false;
      if (e.button === 2) this.mouse.r = false;
    };
    addEventListener('pointerup', up); addEventListener('pointercancel', up);
  },
  // Touch layout: buttons bottom-right, left half = move stick, right half = aim/attack stick
  // Netlify's free-tier badge sits in the bottom-right corner and swallows taps; keep our buttons above it
  badgeH() {
    const now = performance.now(); if (now - (this._bt || 0) < 1000) return this._bh || 0; this._bt = now;
    const f = document.getElementById('nl-badge-frame'); let h = 0;
    if (f) { const r = f.getBoundingClientRect(); if (r.width && r.height && getComputedStyle(f).display !== 'none') h = innerHeight - r.top; }
    return (this._bh = clamp(h, 0, 90));
  },
  touchButtons() {
    const w = innerWidth, s = Math.min(w, innerHeight), A = s * 0.115, h = innerHeight - this.badgeH();
    return [
      { id: 'attack', x: w - A * 1.35, y: h - A * 1.35, r: A },
      { id: 'roll', x: w - A * 3.35, y: h - A * 0.95, r: A * 0.62 },
      { id: 'swap', x: w - A * 1.15, y: h - A * 3.3, r: A * 0.55 },
      { id: 'use', x: w - A * 3.05, y: h - A * 2.75, r: A * 0.6 },
      { id: 'potion', x: w - A * 4.95, y: h - A * 0.9, r: A * 0.5 },
      { id: 'relic', x: w - A * 4.75, y: h - A * 2.3, r: A * 0.5 },
      { id: 'pause', x: w - s * 0.06, y: s * 0.06 + 4, r: s * 0.042 },
    ];
  },
  touchDown(e) {
    this.last = 'touch';
    const x = e.clientX, y = e.clientY;
    for (const b of this.touchButtons()) {
      if (d2(x, y, b.x, b.y) < (b.r * 1.15) ** 2) {
        if (b.id === 'pause') Game.togglePause(); else if (b.id === 'attack') this.atk = e.pointerId; else this.tbtn[b.id] = true;
        return;
      }
    }
    const side = x < innerWidth * 0.5 ? 'L' : 'R';
    if (!this.sticks[side]) this.sticks[side] = { id: e.pointerId, ox: x, oy: y, x, y };
  },
  touchMove(e) {
    for (const s of ['L', 'R']) { const st = this.sticks[s]; if (st && st.id === e.pointerId) { st.x = e.clientX; st.y = e.clientY; } }
  },
  touchUp(e) {
    if (this.atk === e.pointerId) this.atk = null;
    for (const s of ['L', 'R']) { const st = this.sticks[s]; if (st && st.id === e.pointerId) this.sticks[s] = null; }
  },
  stickVec(st, max) {
    if (!st) return { x: 0, y: 0, m: 0 };
    let dx = st.x - st.ox, dy = st.y - st.oy; const l = Math.hypot(dx, dy);
    if (l > max) { st.ox = st.x - dx / l * max; st.oy = st.y - dy / l * max; dx = dx / l * max; dy = dy / l * max; }
    const m = Math.min(1, l / max);
    return { x: l ? dx / l * m : 0, y: l ? dy / l * m : 0, m };
  },
  pads() { return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; },
  // Read one player's controls. src: 'auto' follows the last-used device (solo); 'pad0'.. for co-op later.
  read(src, player) {
    const out = { mx: 0, my: 0, aim: null, attack: false, roll: false, swap: false, use: false, potion: false, relic: false, device: 'kb' };
    let dev = src;
    if (src === 'auto') {
      const p = this.pads()[0];
      if (p && (p.buttons.some(b => b.pressed) || p.axes.some(a => Math.abs(a) > 0.4))) this.last = 'pad';
      dev = this.last === 'pad' ? 'pad0' : this.last;
    }
    out.device = dev.startsWith('pad') ? 'pad' : dev;
    if (dev === 'kb') {
      const k = this.keys;
      out.mx = (k.has('d') || k.has('arrowright') ? 1 : 0) - (k.has('a') || k.has('arrowleft') ? 1 : 0);
      out.my = (k.has('s') || k.has('arrowdown') ? 1 : 0) - (k.has('w') || k.has('arrowup') ? 1 : 0);
      const l = Math.hypot(out.mx, out.my); if (l > 1) { out.mx /= l; out.my /= l; }
      const wp = Render.screenToWorld(this.mouse.x, this.mouse.y);
      out.aim = Math.atan2(wp.y - player.y, wp.x - player.x);
      out.attack = this.mouse.l;
      out.roll = this.pressed.has(' ') || this.pressed.has('shift') || this.mouse.rPressed;
      out.swap = this.pressed.has('q') || this.pressed.has('tab');
      out.use = this.pressed.has('e');
      out.potion = this.pressed.has('r'); out.relic = this.pressed.has('f');
    } else if (dev === 'touch') {
      const max = Math.min(innerWidth, innerHeight) * 0.09;
      const L = this.stickVec(this.sticks.L, max), Rv = this.stickVec(this.sticks.R, max);
      out.mx = L.x; out.my = L.y;
      if (Rv.m > 0.15) { out.aim = Math.atan2(Rv.y, Rv.x); out.attack = true; out.assist = true; }
      else if (this.atk !== null) { out.attack = true; out.autoAim = true; }
      out.roll = this.tbtn.roll; out.swap = this.tbtn.swap; out.use = this.tbtn.use; out.potion = this.tbtn.potion; out.relic = this.tbtn.relic;
    } else {
      const p = this.pads()[+dev.slice(3)] || null;
      if (p) {
        const dz = v => Math.abs(v) < 0.18 ? 0 : v;
        out.mx = dz(p.axes[0]); out.my = dz(p.axes[1]);
        const ax = dz(p.axes[2]), ay = dz(p.axes[3]);
        if (Math.hypot(ax, ay) > 0.3) out.aim = Math.atan2(ay, ax), out.assist = true;
        const btn = i => p.buttons[i] && p.buttons[i].pressed;
        const prev = this.padPrev[p.index] || [];
        const tap = i => btn(i) && !prev[i];
        out.attack = btn(7) || btn(5) || (out.aim !== null && Math.hypot(ax, ay) > 0.6);
        out.roll = tap(0) || tap(6);
        out.swap = tap(3); out.use = tap(2); out.potion = tap(1); out.relic = tap(4);
        if (tap(9)) Game.togglePause();
      }
    }
    return out;
  },
  endFrame() {
    this.pressed.clear(); this.mouse.rPressed = false;
    this.tbtn.roll = this.tbtn.swap = this.tbtn.use = this.tbtn.potion = this.tbtn.relic = false;
    for (const p of this.pads()) this.padPrev[p.index] = p.buttons.map(b => b.pressed);
  },
};

// ===== Audio: everything synthesized, no sound files =====
const Snd = {
  ctx: null, master: null, sfxBus: null, musBus: null, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = Meta.data.muted ? 0 : 0.8; this.master.connect(c.destination);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.55; this.sfxBus.connect(this.master);
    this.musBus = c.createGain(); this.musBus.gain.value = 0.32; this.musBus.connect(this.master);
    const n = c.sampleRate; this.noiseBuf = c.createBuffer(1, n, n);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    Music.boot();
  },
  setMuted(m) { Meta.data.muted = m; Meta.save(); if (this.master) this.master.gain.value = m ? 0 : 0.8; },
  tone(f, dur, type = 'square', vol = 0.2, slide = 0, delay = 0, bus) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, freq = 2000, q = 1, delay = 0, sweep = 0, bus) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * sweep), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || this.sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  last: {},
  play(name) {
    if (!this.ctx) return;
    const now = performance.now(); if (now - (this.last[name] || 0) < 35) return; this.last[name] = now;
    const r = 1 + (Math.random() - 0.5) * 0.12;
    switch (name) {
      case 'swing': this.noise(0.13, 0.22, 1800 * r, 2, 0, 2.6); break;
      case 'arrow': this.noise(0.09, 0.16, 3000 * r, 3, 0, 0.5); this.tone(700 * r, 0.06, 'triangle', 0.06, 0.5); break;
      case 'charge': this.tone(330, 0.12, 'sine', 0.06, 2); break;
      case 'bolt': this.tone(880 * r, 0.08, 'square', 0.05, 0.5); break;
      case 'hit': this.noise(0.07, 0.2, 900 * r, 1.5); this.tone(180 * r, 0.06, 'square', 0.06, 0.6); break;
      case 'deflect': this.tone(1400 * r, 0.09, 'triangle', 0.1, 1.4); break;
      case 'kill': this.noise(0.22, 0.22, 500 * r, 1, 0, 0.3); this.tone(220 * r, 0.18, 'sawtooth', 0.07, 0.3); break;
      case 'hurt': this.tone(300, 0.3, 'sawtooth', 0.18, 0.3); this.noise(0.2, 0.25, 400, 1); break;
      case 'roll': this.noise(0.16, 0.1, 700, 1, 0, 2); break;
      case 'eshot': this.tone(520 * r, 0.07, 'sine', 0.04, 0.7); break;
      case 'ember': this.tone(1100 * r, 0.05, 'sine', 0.05, 1.3); break;
      case 'heart': [523, 659, 784].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.1, 1, i * 0.06)); break;
      case 'item': [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.1, 1, i * 0.07)); break;
      case 'synergy': [523, 784, 1046, 1568].forEach((f, i) => { this.tone(f, 0.4, 'sine', 0.1, 1, i * 0.09); this.tone(f * 1.5, 0.3, 'triangle', 0.04, 1, i * 0.09 + 0.04); }); break;
      case 'door': this.tone(90, 0.3, 'square', 0.12, 0.6); this.noise(0.25, 0.15, 200, 1); break;
      case 'clear': [659, 784, 988].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.08, 1, i * 0.08)); break;
      case 'explode': this.noise(0.45, 0.35, 300, 0.7, 0, 0.25); this.tone(80, 0.4, 'sawtooth', 0.12, 0.4); break;
      case 'zap': this.noise(0.1, 0.18, 4000, 4, 0, 0.4); this.tone(1600 * r, 0.06, 'sawtooth', 0.05, 0.4); break;
      case 'spawn': this.tone(200 * r, 0.3, 'sine', 0.06, 2.2); break;
      case 'boss': this.tone(55, 1.2, 'sawtooth', 0.2, 0.8); this.noise(1, 0.2, 150, 1); break;
      case 'portal': [262, 330, 392, 523, 659].forEach((f, i) => this.tone(f, 0.5, 'sine', 0.08, 1.01, i * 0.05)); break;
      case 'death': [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.4, 'triangle', 0.12, 0.9, i * 0.18)); break;
      case 'ui': this.tone(660, 0.05, 'triangle', 0.06); break;
      case 'heavy': this.noise(0.22, 0.28, 700 * r, 1.5, 0, 2.2); this.tone(110 * r, 0.15, 'triangle', 0.1, 0.6); break;

// Seeded generative music: a minor-key loop that thickens when a fight starts
const Music = {
  on: false, step: 0, next: 0, intensity: 0, target: 0, seed: 1, timer: null,
  boot() { if (this.timer) return; this.timer = setInterval(() => this.tick(), 30); },
  setSeed(s) {
    this.seed = s; const rng = RNG(hash(s, 777));
    const roots = [110, 116.54, 123.47, 130.81, 98, 103.83];
    this.root = rng.pick(roots);
    const scales = [[0, 3, 5, 7, 10], [0, 2, 3, 7, 8], [0, 3, 5, 6, 7, 10]];
    this.scale = rng.pick(scales);
    this.arp = Array.from({ length: 16 }, () => rng.chance(0.75) ? rng.int(0, this.scale.length * 2 - 1) : -1);
    this.bass = Array.from({ length: 16 }, (_, i) => i % 4 === 0 ? rng.pick([0, 0, 3, 4, -2]) : (rng.chance(0.2) ? rng.pick([0, 2]) : null));
    this.prog = [0, rng.pick([3, 5, 8]), rng.pick([5, 7, 10]), rng.pick([3, 7])];
  },
  note(deg, oct = 0) {
    const n = this.scale.length, o = Math.floor(deg / n) + oct, i = ((deg % n) + n) % n;
    return this.root * Math.pow(2, o + this.scale[i] / 12);
  },
  tick() {
    const c = Snd.ctx; if (!c || !this.on || !this.scale) return;
    this.intensity = lerp(this.intensity, this.target, 0.02);
    const spb = 60 / 104 / 4;
    if (this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.12) {
      const s = this.step % 16, bar = Math.floor(this.step / 16) % 4, t = this.next - c.currentTime;
      const shift = Math.pow(2, this.prog[bar] / 12);
      const b = this.bass[s];
      if (b !== null) this.voice(this.note(b, -1) * shift, spb * 3.5, 'triangle', 0.22, t);
      if (s === 0) this.voice(this.note(0, 0) * shift, spb * 15, 'sine', 0.05, t), this.voice(this.note(2, 0) * shift, spb * 15, 'sine', 0.035, t);
      const a = this.arp[s];
      if (a >= 0 && (this.intensity > 0.3 || s % 2 === 0)) this.voice(this.note(a, 1) * shift, spb * 1.6, 'square', 0.025 + 0.02 * this.intensity, t);
      if (this.intensity > 0.4) {
        if (s % 4 === 0) Snd.noise(0.12, 0.18 * this.intensity, 120, 1, t, 0.5, Snd.musBus);
        if (s % 4 === 2) Snd.noise(0.05, 0.08 * this.intensity, 7000, 1, t, 1, Snd.musBus);
        if (s === 4 || s === 12) Snd.noise(0.12, 0.12 * this.intensity, 1500, 0.8, t, 0.6, Snd.musBus);
      }
      this.step++; this.next += spb;
    }
  },
  voice(f, dur, type, vol, delay) { Snd.tone(f, dur, type, vol, 0, delay, Snd.musBus); },
};

// Rarity odds by depth (1-9) and source. Legendary is gated to later worlds and bosses.
function rollRarity(rng, depth, src = 'room') {
  const d = depth;
  const w = [Math.max(20, 60 - 3 * d), 28 + d, 9 + 2 * d, d <= 1 ? 0.6 : 1 + 1.4 * (d - 1), d < 4 ? 0 : 0.25 * (d - 3)];
  if (src === 'boss') { w[0] *= 0.4; w[3] += 6; if (d >= 3) w[4] += 2 + d * 0.6; }
  if (src === 'armory') { w[0] = 0; w[2] += 6; }
  if (src === 'chest') { w[0] = 0; w[3] += 3; if (d >= 4) w[4] += 0.6; }
  if (Meta.has('luck')) { w[2] *= 1.4; w[3] *= 1.4; w[4] *= 1.4; }
  const rm = (Game.diff && Game.diff.rare) || 1; w[2] *= rm; w[3] *= rm; w[4] *= rm;
  let tot = w.reduce((a, b) => a + b, 0), r = rng() * tot;
  for (let i = 0; i < 5; i++) { r -= w[i]; if (r <= 0) return i; }
  return 0;
}
// Drops lean 60% toward your class's weapon family
function pickWeaponType(rng) {
  const mine = CLASSES[Game.cls || 'fighter'].cat, others = ['melee', 'ranged', 'magic'].filter(c => c !== mine);
  const cat = rng.chance(0.6) ? mine : rng.pick(others);
  return rng.pick(Object.keys(WBASE).filter(k => WBASE[k].cat === cat));
}

// Build a weapon from a seed. Everything about it comes out of the rng.
function makeWeapon(rng, opts = {}) {
  const type = opts.type || pickWeaponType(rng);
  const B = WBASE[type];
  let rar = opts.rarity !== undefined ? opts.rarity : rollRarity(rng, opts.depth || 1, opts.src);
  if (Game.mods.allLegendary) rar = 4;
  const R0 = RARITY[rar];
  const w = { type, cat: B.cat, rarity: rar, crit: B.crit, quirks: [], uid: Math.random().toString(36).slice(2, 10) };
  if (type === 'spellbook') {
    w.spell = opts.spell || rng.pick(Object.keys(SPELLS));
    const S = SPELLS[w.spell]; w.elem = S.elem; w.dmg = rng.range(...S.dmg) * R0.m; w.cd = rng.range(...S.cd);
  } else {
    w.dmg = rng.range(...B.dmg) * R0.m; w.cd = rng.range(...B.cd);
    const elemChance = [0.15, 0.35, 0.55, 1, 1][rar] + (B.cat === 'magic' ? 0.4 : 0);
    w.elem = opts.elem || (rng.chance(elemChance) ? rng.pick(['fire', 'frost', 'storm', 'arcane']) : 'none');
  }
  if (B.reach) { w.reach = rng.range(...B.reach); w.arc = rng.range(...B.arc) * Math.PI / 180; }
  if (B.charge) w.charge = rng.range(...B.charge);
  if (B.speed) w.speed = rng.range(...B.speed);
  if (B.spread) w.spread = rng.range(...B.spread);
  const nq = rar >= 4 ? 2 : rar === 3 ? (rng.chance(0.5) ? 2 : 1) : rar === 2 ? 1 : rar === 1 ? (rng.chance(0.4) ? 1 : 0) : 0;
  const pool = rng.shuffle(QUIRKS.filter(q => q.t.includes(type)));
  for (let i = 0; i < nq && i < pool.length; i++) w.quirks.push(pool[i].id);
  if (w.quirks.includes('heavy')) { w.dmg *= 1.5; w.cd *= 1.35; }
  if (w.quirks.includes('swift')) w.cd /= 1.3;
  if (w.quirks.includes('keen')) w.crit += 0.15;
  const base = rng.pick(B.names), el = ELEM[w.elem].n;
  if (opts.name) w.name = opts.name;

  else if (rar === 4) w.name = `${properName(rng)}, ${el ? el + ' ' : ''}${base}`;
  else {
    const q = w.quirks[0] ? QUIRKS.find(x => x.id === w.quirks[0]) : null;
    w.name = `${el ? el + ' ' : ''}${base}${q ? ' ' + q.suf : ''}`;
  }

}

    const target = (l === 1 ? 8 : 9) + (w > 1 ? 1 : 0);

    const ends = rooms.filter(r => r.links.length === 1 && r.type !== 'start').sort((a, b) => b.dist - a.dist);
    const boss = ends[0] || rooms[rooms.length - 1]; boss.type = l === 3 ? 'boss' : 'exit';
    if (l === 2) { const a = ends[1] || rng.pick(rooms.filter(r => r.type === 'combat')); if (a) a.type = 'armory'; }

      const n = cells.get(key(r.cx + dx, r.cy + dy));
      if (n && n.id > r.id && !r.links.includes(n.id) && r.type !== 'boss' && n.type !== 'boss' && r.type !== 'exit' && n.type !== 'exit' && rng.chance(0.12)) link(r, n);

    // bounding rects (odd sizes keep a clean center tile)
    for (const r of rooms) {
      if (r.type === 'boss') { r.w = 29; r.h = 21; }
      else if (r.type === 'exit') { r.w = 25; r.h = 17; }
      else if (r.type === 'start' || r.type === 'armory') { r.w = 13; r.h = 11; }
      else { r.w = rng.pick([15, 17, 19, 21, 23, 25]); r.h = rng.pick([11, 13, 15, 17, 19]); }

  },
  placeKeyAndChest() {
    const spot = (r, salt) => { const rr = RNG(hash(Game.seedNum, this.depth, r.id, salt)); for (let i = 0; i < 60; i++) { const tx = r.x + 2 + rr.int(0, r.w - 5), ty = r.y + 2 + rr.int(0, r.h - 5); if (this.map[ty * MW + tx] === FLOOR && this.roomId[ty * MW + tx] === r.id) return { x: tx * T + T / 2, y: ty * T + T / 2 }; } return this.freeSpot(r.mx * T + T / 2, r.my * T + T / 2); };

  },
  // Carve the inside of a room. Caves and forests grow from a cellular automaton; crypts are unions of halls.
  carveRoom(r, rng, style) {
    const map = this.map, w = r.w, h = r.h, cx = (w - 1) / 2, cy = (h - 1) / 2;
    const g = new Uint8Array(w * h); // 1 = floor

        const e = ((x - cx) / (w / 2)) ** 2 + ((y - cy) / (h / 2)) ** 2;

// ===== Game: state, runs, menus =====
const Game = {
  state: 'menu', seed: '', seedNum: 0, mods: {}, cls: 'fighter', secret: null, hs: 0, runEmbers: 0, runTime: 0, bannerData: null, deadT: 0,
  hitstop(t) { this.hs = Math.max(this.hs, t); },
  banner(title, sub, dur = 2) { this.bannerData = { title, sub, dur, t: 0 }; },
  // Difficulty per mode. Quick-play is lighter and loot-rich; Campaign is a gear check.
  DIFF: {
    quick: { hp: 0.85, boss: 1, shot: 1, loot: 1.4, rare: 1.2 },
    campaign: { hp: 1.6, boss: 1.5, shot: 1.1, loot: 0.5, rare: 0.6 },
  },
  mode: 'quick', char: null, diff: null, runXp: 0,
  newRun(seedStr, cls, opts = {}) {
    Snd.init(); Screen.goFull();
    this.mode = opts.campaign ? 'campaign' : 'quick';
    if (!opts.campaign) this.char = null;
    this.diff = this.DIFF[this.mode];
    this.cls = cls || Meta.data.lastClass || 'fighter';
    if (this.mode === 'quick') { if (this.cls !== 'fighter' && !Meta.has(this.cls)) this.cls = 'fighter'; Meta.data.lastClass = this.cls; }
    this.seed = normSeed(seedStr) || randomSeed();

    const sec = this.mode === 'quick' ? SECRETS[this.seedNum] : null;
    this.secret = sec || null; this.mods = sec ? { ...sec.mods } : {};

    Music.setSeed(this.seedNum); Music.on = true;
    World.startLevel(opts.world || 1, 1);
    if (sec) {
      const first = !Meta.data.secrets[this.seed];
      if (first) { Meta.data.secrets[this.seed] = sec.n; Meta.data.embers += 25; Meta.save(); }
      setTimeout(() => this.banner('Secret Seed: ' + sec.n, sec.d + (first ? '  (+25 embers)' : ''), 3.4), 2700);
    }
    this.state = 'play'; Menu.hide();
  },
  nextLevel(last) {
    if (last) { this.end(true); return; }
    if (World.level < 3) World.startLevel(World.world, World.level + 1, true);

  onDeath() { this.deadT = 1.4; Music.target = 0; },

    if (this.mode === 'campaign') { Music.on = false; Snd.play(won ? 'portal' : 'death'); Campaign.finish(won); return; }
    Meta.data.embers += this.runEmbers;
    Meta.data.stats.bestDepth = Math.max(Meta.data.stats.bestDepth || 0, World.depth);
    if (won) Meta.data.stats.wins++;

    Snd.play(won ? 'portal' : 'death');
    Menu.show(won ? 'win' : 'dead');

        <div class="stats"><span>Class</span><span>${CLASSES[Game.cls].n}</span><span>Seed</span><span>${Game.seed}</span><span>Level reached</span><span>${levelLabel(World.world, World.level)}</span><span>Time</span><span>${fmtTime(Game.runTime)}</span><span>Foes slain</span><span>${p.kills}</span><span>Items</span><span>${p.items.length}</span><span>Embers banked</span><span class="ember">+${Game.runEmbers}</span></div>
        <button class="btn" id="b-again">Same Seed Again</button>
        <button class="btn" id="b-new">New Seed</button>
        <div class="row"><button class="btn small" id="b-save">Save Seed</button><button class="btn small" id="b-sanct">Sanctum · ${M.embers} ◆</button></div>
        <button class="btn small" id="b-title">Title</button>`);

      this.on('b-save', () => { Game.saveSeed(); document.getElementById('b-save').textContent = 'Saved ✓'; });
      this.on('b-sanct', () => { World.map = null; this.show('sanctum'); });
      this.on('b-title', () => { World.map = null; this.show('title'); });
    }
  },
};
function statBlock(p) {
  const st = p.st, pct = v => (v >= 0 ? '+' : '') + Math.round(v * 100) + '%', C = CLASSES[p.cls];
  const rows = [
    ['Class', C.n], ['Hearts', `${p.hp / 2} / ${p.maxHp / 2}`],
    ['Move speed', pct(st.speed / 155 - 1)], ['Attack speed', pct(st.rate - 1)],
    ['Damage', pct(st.dmg - 1)], ['Melee damage', pct(st.meleeDmg - 1)],
    ['Ranged damage', pct(st.rangedDmg - 1)], ['Bow draw time', pct(st.draw - 1)],
    ['Crit chance', Math.round(((p.weapons[p.wi].crit || 0) + st.crit) * 100) + '%'], ['Crit damage', Math.round(st.critMult * 100) + '%'],
    [p.cls === 'mage' ? 'Blink cooldown' : 'Roll cooldown', (st.rollCd + (p.cls === 'mage' ? 0.5 : 0.34)).toFixed(2) + 's'], ['Mana', `${Math.round(p.maxMana)} · regen ${Math.round(p.manaRegen * 100)}%`],
    ['Extra projectiles', st.extraShots], ['Bounces', st.bounce],
    ['Damage taken', st.hurtMult > 1 ? 'x' + st.hurtMult : 'normal'], ['Keys', p.keys],
    ['Potion', p.potion ? potionById(p.potion).n : '-'], ['Relic', p.relic ? relicById(p.relic).n : '-'],
  ];
  return rows.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('');
}
function fmtTime(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// ===== Shop stock (limited, reshuffled after each run) =====
const Shop = {
  ensure() { if (!Meta.data.shop) this.reroll(); },
  reroll() {
    const rng = RNG((Math.random() * 4294967296) >>> 0);
    Meta.data.shop = { potions: rng.shuffle(POTIONS.map(x => x.id)).slice(0, 3), relics: rng.shuffle(RELICS.map(x => x.id)).slice(0, 2) };
  },
};

// ===== New-version check: compare our build stamp with the one on the server =====
const Updater = {
  pending: false,
  async check() {
    if (location.protocol === 'file:' || this.pending) return;
    try {
      const txt = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
      const m = txt.match(/const BUILD = (\d+)/);
      if (m && +m[1] > BUILD) { this.pending = true; this.show(); }
    } catch (e) { }
  },
  show() {
    if (document.getElementById('upd')) return;
    const b = document.createElement('button'); b.id = 'upd';
    b.textContent = 'New version available. Tap to reload';
    b.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:20px;border:1px solid #ffb057;background:#2d2150;color:#ffe2b0;font:700 14px ui-rounded,system-ui,sans-serif;box-shadow:0 0 16px rgba(255,150,60,.35)';
    b.onclick = () => location.reload();
    document.body.appendChild(b);
  },
};
setTimeout(() => Updater.check(), 3000);
setInterval(() => { if (Game.state !== 'play') Updater.check(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) Updater.check(); });


// ===== Campaign: persistent heroes, stash, loadout, world unlocks, corpse runs =====
const SCRAP = [5, 15, 40, 100, 250]; // embers for scrapping a weapon, by rarity
const xpNeed = lvl => Math.round(80 * Math.pow(lvl, 1.35));
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

const Campaign = {
  data() { const M = Meta.data; if (!M.camp) M.camp = { slots: [null, null, null] }; return M.camp; },
  hero(i) { return this.data().slots[i]; },
  create(i, name, cls) {
    const rng = RNG((Math.random() * 4294967296) >>> 0), C = CLASSES[cls];
    const weapons = C.kit.map(k => makeWeapon(rng, { type: k.type, spell: k.spell, rarity: 0, elem: k.type === 'wand' || k.type === 'spellbook' ? undefined : 'none', name: k.name }));
    const h = { name: name || C.n, cls, lvl: 1, xp: 0, embers: 0, unlocks: {}, stash: { weapons, relics: [], potions: [] }, load: { w: weapons.map(w => w.uid), relic: null, potion: null }, cleared: 0, corpse: null, shop: null, stats: { runs: 0, deaths: 0, kills: 0, clears: 0 } };
    this.data().slots[i] = h; Meta.save(); return h;
  },
  loadoutWeapons(h) {
    const pick = h.load.w.map(u => h.stash.weapons.find(w => w.uid === u)).filter(Boolean);
    for (const w of h.stash.weapons) if (pick.length < 2 && !pick.includes(w)) pick.push(w);
    return pick.slice(0, 2).map(w => JSON.parse(JSON.stringify(w)));
  },
  start(i, world, useCorpse) {
    const h = this.hero(i); Game.char = h; Game.charIdx = i;
    if (!useCorpse && h.corpse && h.corpse.world === world) h.corpse = null; // a fresh dungeon abandons your remains
    const seed = useCorpse && h.corpse ? h.corpse.seed : randomSeed();
    Game.loadPotion = h.load.potion; Game.loadRelic = h.load.relic;
    h.stats.runs++; Meta.save();
    Game.newRun(seed, h.cls, { campaign: true, world });
  },
  // End of a campaign run: embers and XP always stick; new gear only if you beat the world boss
  finish(won) {
    const h = Game.char, p = World.players[0], W = World.world;
    const res = { won, embers: Game.runEmbers, xp: Game.runXp, levels: 0, banked: [], lost: [] };
    h.embers += Game.runEmbers; h.xp += Game.runXp; h.stats.kills += p.kills;
    while (h.xp >= xpNeed(h.lvl)) { h.xp -= xpNeed(h.lvl); h.lvl++; res.levels++; }
    if (Game.loadPotion && p.potion !== Game.loadPotion) { // the packed potion got drunk (or swapped away)
      const i = h.stash.potions.indexOf(Game.loadPotion); if (i >= 0) h.stash.potions.splice(i, 1);
      if (!h.stash.potions.includes(h.load.potion)) h.load.potion = null;
    }
    const have = new Set(h.stash.weapons.map(w => w.uid));
    const newW = p.weapons.filter(w => !have.has(w.uid));
    const newRelic = p.relic && !h.stash.relics.includes(p.relic) ? p.relic : null;
    const newPotion = p.potion && p.potion !== Game.loadPotion ? p.potion : null;
    if (won) {
      for (const w of newW) { h.stash.weapons.push(w); res.banked.push(w.name); }
      if (newRelic) { h.stash.relics.push(newRelic); res.banked.push(relicById(newRelic).n); }
      if (newPotion) { h.stash.potions.push(newPotion); res.banked.push(potionById(newPotion).n); }
      res.unlocked = W >= h.cleared + 1 && W < WORLD_COUNT ? WORLDS[W + 1].n : null;
      h.cleared = Math.max(h.cleared, W); h.stats.clears++;
    } else {
      h.stats.deaths++;
      if (newW.length || newRelic || newPotion) {
        h.corpse = { seed: Game.seed, world: W, stage: World.level, x: p.x, y: p.y, loot: { weapons: newW, relic: newRelic, potion: newPotion } };
        res.lost = newW.map(w => w.name).concat(newRelic ? [relicById(newRelic).n] : [], newPotion ? [potionById(newPotion).n] : []);
      }
    }
    h.shop = null; Meta.save();
    Menu.show('campDone', res);
  },
  shopStock(h) {
    if (!h.shop) { const rng = RNG((Math.random() * 4294967296) >>> 0); h.shop = { potions: rng.shuffle(POTIONS.map(x => x.id)).slice(0, 3), relics: rng.shuffle(RELICS.map(x => x.id)).slice(0, 2) }; Meta.save(); }
    return h.shop;
  },
};

// ===== Quick-play merchant: spend this run's embers between stages =====
const Merchant = {
  stock(depth) {
    const rng = RNG(hash(Game.seedNum, depth, 919));
    const ps = rng.shuffle(POTIONS.slice()).slice(0, 2).map(P => ({ kind: 'potion', id: P.id, price: Math.round(P.cost * 0.5) }));
    const Rl = rng.pick(RELICS), w = makeWeapon(rng, { depth, src: 'armory' });
    return ps.concat([{ kind: 'relic', id: Rl.id, price: Math.round(Rl.cost * 0.4) }, { kind: 'weapon', w, price: [30, 50, 90, 150, 260][w.rarity] }]);
  },
};

  hub(i) {

        ? `<button class="btn" id="corpse-${w}">Return to remains</button><button class="btn" id="go-${w}">New dungeon</button>`
        : `<button class="btn" id="go-${w}">Descend</button>`;
      return `<div class="card" style="${open ? '' : 'opacity:.5'}"><div class="grow"><b style="color:${WORLDS[w].tint}">${WORLDS[w].n}</b>${w <= h.cleared ? ' <span class="secret">✓</span>' : ''}<small>${here ? `Your remains lie on level ${levelLabel(w, cp.stage)}` : w <= h.cleared ? 'Cleared. Replay to farm gear.' : open ? 'Beat the boss on ' + levelLabel(w, 3) + ' to clear' : 'Clear the world before it'}</small></div>${btns}</div>`;
    }).join('');
    const pct = Math.round(h.xp / xpNeed(h.lvl) * 100);
    Menu.html(`<h2 style="margin-bottom:4px">${esc(h.name)}</h2><div class="sub" style="margin-bottom:12px"><span style="color:${C.c}">Level ${h.lvl} ${C.n}</span> · XP ${pct}% · <span class="ember">${h.embers} embers</span></div>
      <div class="list">${worlds}</div>
      <div class="row"><button class="btn small" id="b-load">Loadout</button><button class="btn small" id="b-hsanct">Sanctum</button><button class="btn small" id="b-hshop">Shop</button></div>
      <button class="btn small" id="b-back">Heroes</button>`);
    for (const w of [1, 2, 3]) { Menu.on('go-' + w, () => Campaign.start(i, w, false)); Menu.on('corpse-' + w, () => Campaign.start(i, w, true)); }
    Menu.on('b-load', () => Menu.show('loadout', i));
    Menu.on('b-hsanct', () => Menu.show('heroSanctum', i));
    Menu.on('b-hshop', () => Menu.show('heroShop', i));
    Menu.on('b-back', () => Menu.show('camp'));
  },
  loadout(i) {
    const h = Campaign.hero(i), L = h.load;
    const wcard = (w, k) => {
      const on = L.w.includes(w.uid);
      return `<div class="card"><div class="grow"><b style="color:${RARITY[w.rarity].c}">${esc(w.name)}</b><small>${RARITY[w.rarity].n} ${w.type} · ${weaponLine(w)}</small>${w.quirks.length ? `<small>${w.quirks.map(q => QUIRKS.find(x => x.id === q).d).join(' · ')}</small>` : ''}</div>
        <button class="btn" id="eq-w-${k}">${on ? 'Equipped' : 'Equip'}</button>${on ? '' : `<button class="btn" id="sc-w-${k}">Scrap ${SCRAP[w.rarity]}◆</button>`}</div>`;
    };
    const rcard = (id, k) => { const D = relicById(id), on = L.relic === id; return `<div class="card"><div class="grow"><b style="color:${D.c}">${D.n}</b><small>${D.d}</small></div><button class="btn" id="eq-r-${k}">${on ? 'Equipped' : 'Equip'}</button></div>`; };
    const pcard = (id, k) => { const D = potionById(id), on = L.potion === id && h.stash.potions.indexOf(id) === k; return `<div class="card"><div class="grow"><b style="color:${D.c}">${D.n}</b><small>${D.d} · used up when you drink it</small></div><button class="btn" id="eq-p-${k}">${on ? 'Packed' : 'Pack'}</button></div>`; };
    Menu.html(`<h2>Loadout</h2><div class="sub">Take 2 weapons, 1 relic and 1 potion into the dungeon. Your stash gear is never lost.</div>
      <div class="list"><div class="sub" style="margin:4px 0">Weapons (${h.stash.weapons.length})</div>${h.stash.weapons.map(wcard).join('')}
      <div class="sub" style="margin:10px 0 4px">Relics</div>${h.stash.relics.map(rcard).join('') || '<small>None yet. Find them in chests or buy them in the Shop.</small>'}
      <div class="sub" style="margin:10px 0 4px">Potions</div>${h.stash.potions.map(pcard).join('') || '<small>None yet.</small>'}</div>
      <button class="btn small" id="b-back">Back</button>`);
    h.stash.weapons.forEach((w, k) => {
      Menu.on('eq-w-' + k, () => { if (!L.w.includes(w.uid)) { L.w = [L.w[1] || L.w[0], w.uid].filter(Boolean).slice(-2); Meta.save(); } Menu.show('loadout', i); });
      Menu.on('sc-w-' + k, () => { if (h.stash.weapons.length <= 2) return; h.stash.weapons.splice(k, 1); h.embers += SCRAP[w.rarity]; Snd.play('ember'); Meta.save(); Menu.show('loadout', i); });
    });
    h.stash.relics.forEach((id, k) => Menu.on('eq-r-' + k, () => { L.relic = L.relic === id ? null : id; Meta.save(); Menu.show('loadout', i); }));
    h.stash.potions.forEach((id, k) => Menu.on('eq-p-' + k, () => { L.potion = L.potion === id ? null : id; Meta.save(); Menu.show('loadout', i); }));
    Menu.on('b-back', () => Menu.show('hub', i));
  },
  heroSanctum(i) {
    const h = Campaign.hero(i), list = UNLOCKS.filter(u => !['ranger', 'mage', 'kit'].includes(u.id));
    const rows = list.map(u => { const own = h.unlocks[u.id], locked = u.req && !h.unlocks[u.req]; return `<div class="card"><div class="grow"><b>${u.n}</b><small>${locked ? 'Requires ' + UNLOCKS.find(x => x.id === u.req).n : u.d}</small></div>${own ? '<span class="ember">✓</span>' : `<button class="btn" id="u-${u.id}" ${h.embers < u.cost || locked ? 'disabled' : ''}>${u.cost} ◆</button>`}</div>`; }).join('');
    Menu.html(`<h2>${esc(h.name)}'s Sanctum</h2><div class="sub"><span class="ember">${h.embers} embers</span> · Level ${h.lvl}: +${3 * (h.lvl - 1)}% damage, +${2 * (h.lvl - 1)} mana, +${Math.floor(h.lvl / 5)} hearts</div><div class="list">${rows}</div><button class="btn small" id="b-back">Back</button>`);
    for (const u of list) Menu.on('u-' + u.id, () => { if (h.embers >= u.cost) { h.embers -= u.cost; h.unlocks[u.id] = 1; Meta.save(); Snd.play('item'); Menu.show('heroSanctum', i); } });
    Menu.on('b-back', () => Menu.show('hub', i));
  },
  heroShop(i) {
    const h = Campaign.hero(i), S = Campaign.shopStock(h);
    const card = (kind, id, k) => { const D = kind === 'potion' ? potionById(id) : relicById(id), owned = kind === 'relic' && h.stash.relics.includes(id); return `<div class="card"><div class="grow"><b style="color:${D.c}">${D.n}</b><small>${D.d}</small></div><button class="btn" id="buy-${kind}-${k}" ${owned || h.embers < D.cost ? 'disabled' : ''}>${owned ? 'Owned' : D.cost + ' ◆'}</button></div>`; };
    Menu.html(`<h2>Shop</h2><div class="sub">Purchases go to your stash. Stock changes after every run.<br><span class="ember">${h.embers} embers</span></div><div class="list">${S.potions.map((id, k) => card('potion', id, k)).join('')}${S.relics.map((id, k) => card('relic', id, k)).join('') || ''}</div><button class="btn small" id="b-back">Back</button>`);
    ['potion', 'relic'].forEach(kind => (kind === 'potion' ? S.potions : S.relics).forEach((id, k) => Menu.on(`buy-${kind}-${k}`, () => {
      const D = kind === 'potion' ? potionById(id) : relicById(id); if (h.embers < D.cost) return;
      h.embers -= D.cost; (kind === 'potion' ? h.stash.potions : h.stash.relics).push(id); (kind === 'potion' ? S.potions : S.relics).splice(k, 1);
      Meta.save(); Snd.play('item'); Menu.show('heroShop', i);
    })));
    Menu.on('b-back', () => Menu.show('hub', i));
  },
  campDone(r) {
    const h = Game.char, i = Game.charIdx;
    const body = r.won
      ? `<h1 style="font-size:clamp(34px,7vw,56px)">WORLD CLEARED</h1><div class="sub">${WORLDS[World.world].n} is yours.${r.unlocked ? ` <b>${r.unlocked}</b> is now open.` : ''}</div>
         <div class="sub">${r.banked.length ? 'Added to your stash: <b>' + r.banked.map(esc).join(', ') + '</b>' : 'No new gear this time.'}</div>`
      : `<h1 style="font-size:clamp(34px,7vw,56px)">FALLEN</h1><div class="sub">${r.lost.length ? `Your remains hold <b>${r.lost.map(esc).join(', ')}</b> on level ${levelLabel(World.world, World.level)}. Return to them on your next run.` : 'You lost nothing you had banked.'}</div>`;
    Menu.html(`${body}<div class="stats"><span>Embers kept</span><span class="ember">+${r.embers}</span><span>XP</span><span>+${r.xp}${r.levels ? ` · <b class="secret">Level up! Now ${h.lvl}</b>` : ''}</span><span>Time</span><span>${fmtTime(Game.runTime)}</span></div>
      <button class="btn" id="b-hub">Back to ${esc(h.name)}</button>`);
    Menu.on('b-hub', () => Menu.show('hub', i));
  },
  merchant() {
    const st = World.merchant || [], p = World.players[0];
    const rows = st.map((it, k) => {
      if (it.sold) return '';
      const D = it.kind === 'potion' ? potionById(it.id) : it.kind === 'relic' ? relicById(it.id) : null;
      const name = D ? D.n : it.w.name, col = D ? D.c : RARITY[it.w.rarity].c, desc = D ? D.d : `${RARITY[it.w.rarity].n} ${it.w.type} · ${weaponLine(it.w)}`;
      return `<div class="card"><div class="grow"><b style="color:${col}">${esc(name)}</b><small>${desc}</small></div><button class="btn" id="m-${k}" ${Game.runEmbers < it.price ? 'disabled' : ''}>${it.price} ◆</button></div>`;
    }).join('');
    Menu.html(`<h2>Wandering Merchant</h2><div class="sub">"Embers for wares, friend." You have <span class="ember">${Game.runEmbers}</span> this run. What you don't spend is banked at the end.</div><div class="list">${rows || '<div class="sub">Sold out.</div>'}</div><button class="btn" id="b-leave">Leave</button>`);
    st.forEach((it, k) => Menu.on('m-' + k, () => {
      if (it.sold || Game.runEmbers < it.price) return;
      Game.runEmbers -= it.price; it.sold = true; Snd.play('item');
      if (it.kind === 'weapon') World.pickups.push({ kind: 'weapon', w: it.w, x: p.x + 24, y: p.y, t: 0 });
      else { const old = p[it.kind]; p[it.kind] = it.id; if (it.kind === 'relic') p.relicCd = 0; if (old) World.pickups.push({ kind: it.kind, id: old, x: p.x + 24, y: p.y, t: 0 }); }
      Menu.show('merchant');
    }));
    Menu.on('b-leave', () => { Game.state = 'play'; Menu.hide(); });
  },
};
{
  const base = Menu.show.bind(Menu);
  Menu.show = function (name, arg) { if (CampScreens[name]) CampScreens[name](arg); else base(name, arg); };
}

// ===== Boot =====
Meta.load();
Render.init();
Input.init(Render.cv);
Menu.el = document.getElementById('menu');
Menu.el.addEventListener('pointerdown', () => Snd.init());
Menu.show('title');
requestAnimationFrame(t => Game.frame(t));
window.__emberdeep = { Game, World, Meta, Render };

</script>
</body>
</html>
