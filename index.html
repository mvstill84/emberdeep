<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0b0816;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,sans-serif;color:#e9e4ff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
button,input,textarea,select{touch-action:manipulation}
#menu{position:fixed;inset:0;display:flex;background:rgba(8,5,18,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5;padding:20px;overflow:auto}
#menu.hidden{display:none}
.panel{width:min(560px,100%);text-align:center;margin:auto}
h1{font-size:clamp(44px,9vw,84px);letter-spacing:.06em;font-weight:800;background:linear-gradient(180deg,#ffd27a,#ff6a2a 60%,#b0306a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,120,40,.45))}
h2{font-size:28px;margin-bottom:14px;color:#ffcf8a}
.sub{opacity:.7;margin:6px 0 26px;font-size:15px}
.btn{display:block;width:100%;margin:10px 0;padding:15px 18px;font:inherit;font-size:18px;font-weight:700;color:#f4eeff;background:linear-gradient(180deg,#2d2150,#1c1436);border:1px solid #5b47a0;border-radius:12px;cursor:pointer;box-shadow:0 0 0 rgba(0,0,0,0);transition:box-shadow .15s,border-color .15s}
.btn:hover,.btn:focus-visible{border-color:#ffb057;box-shadow:0 0 16px rgba(255,150,60,.35);outline:none}
.btn.small{font-size:15px;padding:10px 12px}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none;border-color:#3a2f60}
.code{display:block;width:100%;height:84px;margin:8px 0;padding:10px;font:12px ui-monospace,Menlo,monospace;color:#e8dcff;background:#120c24;border:1px solid #5b47a0;border-radius:10px;resize:none;word-break:break-all;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.dsec{margin:18px 0 6px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:#ffb0ec;text-align:left}.drow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;font-size:14px}.dsel,.dnum{font:inherit;font-size:14px;color:#f4eeff;background:#1c1436;border:1px solid #5b47a0;border-radius:8px;padding:7px 8px}.dnum{width:64px}.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;text-align:left;font-size:14px}.dchk{display:flex;gap:6px;align-items:center;cursor:pointer}
@media (max-height:560px){.qrwrap{display:flex;gap:18px;align-items:center;text-align:left}.qrwrap h2{margin-top:0}#menu canvas.qrc{max-height:calc(100vh - 40px)!important;margin:0!important}}
#menu canvas.qrc{image-rendering:pixelated;position:static;display:block;margin:10px auto;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 170px);background:#fff;border-radius:10px;inset:auto}
.row{display:flex;gap:10px}.row .btn{flex:1}
input.seed{width:100%;padding:14px;font:inherit;font-size:24px;letter-spacing:.15em;text-align:center;text-transform:uppercase;background:#140e26;color:#ffe2b0;border:1px solid #5b47a0;border-radius:12px;outline:none}
input.seed:focus{border-color:#ffb057}
.list{max-height:46vh;overflow:auto;text-align:left;margin:8px 0}
.card{display:flex;align-items:center;gap:12px;padding:12px;margin:8px 0;border:1px solid #3a2f60;border-radius:12px;background:#150f28}
.card .grow{flex:1}.card b{color:#ffe2b0}.card small{display:block;opacity:.7;margin-top:2px}
.card .btn{width:auto;margin:0;padding:8px 14px;font-size:14px}
.ember{color:#ffb057;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;margin:14px auto;max-width:360px;font-size:15px}
.stats span:nth-child(even){text-align:right;color:#ffe2b0}
.hint{font-size:13px;opacity:.55;margin-top:14px;line-height:1.5}
.secret{color:#7fffd4}
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#0b0816;color:#e9e4ff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:14px}
#rotate .ph{width:46px;height:78px;border:3px solid #ffb057;border-radius:9px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>
<div id="rotate"><div class="ph"></div><h2>Turn your phone sideways</h2><div class="sub" style="margin:0">Emberdeep plays in landscape.<br>On iPhone, tap Share then Add to Home Screen for true full screen.</div></div>
<script>
'use strict';
const BUILD = 31;
const PCOL = ['#ffb057', '#6fd3ff', '#c38cff']; // player colors in co-op
// ===== Core: math, seeded randomness, storage =====
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (ax, ay, bx, by) => { const x = bx - ax, y = by - ay; return x * x + y * y; };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// One hash to rule them all: (seed, a, b, salt) -> uint32. Same inputs, same answer, forever.
function hash(a, b = 0, c = 0, d = 0) {
  let h = (a | 0) ^ 0x9E3779B9;
  h = Math.imul(h ^ (b | 0), 0x85EBCA6B); h ^= h >>> 13;
  h = Math.imul(h ^ (c | 0), 0xC2B2AE35); h ^= h >>> 16;
  h = Math.imul(h ^ (d | 0), 0x27D4EB2F); h ^= h >>> 15;
  return h >>> 0;
}
function strHash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

// Small fast PRNG (mulberry32) with helpers
function RNG(seed) {
  let t = seed >>> 0;
  const f = () => {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
  f.int = (a, b) => a + Math.floor(f() * (b - a + 1));
  f.range = (a, b) => a + f() * (b - a);
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  f.weighted = (list, wf) => { let tot = 0; for (const x of list) tot += wf(x); let r = f() * tot; for (const x of list) { r -= wf(x); if (r <= 0) return x; } return list[list.length - 1]; };
  return f;
}
const R = RNG((Math.random() * 4294967296) >>> 0); // unseeded combat randomness

const SEED_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normSeed = s => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
const randomSeed = () => { let s = ''; for (let i = 0; i < 6; i++) s += SEED_CHARS[Math.floor(Math.random() * SEED_CHARS.length)]; return s; };

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

// ===== Phones: fullscreen + landscape lock (Android Chrome; iPhone needs Add to Home Screen) =====
const Screen = {
  touch: matchMedia('(pointer:coarse)').matches,
  goFull() {
    if (!this.touch) return;
    const el = document.documentElement;
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
        if (p && p.then) p.then(() => this.lock()).catch(() => {});
        else this.lock();
      } else this.lock();
    } catch (e) { }
  },
  lock() { try { const o = screen.orientation; if (o && o.lock) o.lock('landscape').catch(() => {}); } catch (e) { } },
  portrait() { return this.touch && innerHeight > innerWidth; },
};

// ===== Persistent meta (embers, unlocks, saved seeds, secrets) =====
const SAVE_KEY = (() => { try { return localStorage.getItem('emberdeep.devmode') === '1' ? 'emberdeep.dev' : 'emberdeep.v1'; } catch (e) { return 'emberdeep.v1'; } })(); // dev mode plays on a sandbox copy
const Meta = {
  data: { embers: 0, unlocks: {}, seeds: [], secrets: {}, stats: { runs: 0, wins: 0, bestDepth: 0, kills: 0 }, muted: false },
  load() {
    try { const s = localStorage.getItem(SAVE_KEY); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) { }
    this.data.stats = Object.assign({ runs: 0, wins: 0, bestFloor: 0, kills: 0 }, this.data.stats);
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { } },
  // Save codes: the whole save as one pasteable string, so progress can move between devices or sites
  exportCode() {
    const bytes = new TextEncoder().encode(JSON.stringify(this.data));
    let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
    return 'EMBER1.' + btoa(bin);
  },
  importCode(code) { // returns an error message, or null on success
    code = (code || '').replace(/\s+/g, '');
    if (!code.startsWith('EMBER1.')) return "That doesn't look like an Emberdeep save code.";
    let d;
    try { const bin = atob(code.slice(7)); d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))); }
    catch (e) { return 'That code is damaged or incomplete. Try copying it again.'; }
    if (!d || typeof d !== 'object' || typeof d.embers !== 'number') return "That code doesn't contain a save.";
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) { return "Couldn't write the save on this device."; }
    return null;
  },
  has(id) { // campaign heroes have their own Sanctum
    if (this.over) return !!this.over[id]; // co-op: building another player's hero with their unlocks
    const u = typeof Game !== 'undefined' && Game.mode === 'campaign' && Game.char ? Game.char.unlocks : this.data.unlocks;
    return !!u[id];
  },
};

// ===== Input: keyboard/mouse, touch twin-sticks, gamepads, read through "slots" =====
const Input = {
  keys: new Set(), pressed: new Set(),
  mouse: { x: 0, y: 0, l: false, r: false, rPressed: false },
  last: 'kb', // 'kb' | 'touch' | 'pad'
  sticks: { L: null, R: null }, // touch sticks {id, ox, oy, x, y}
  tbtn: { roll: false, swap: false, use: false, bag: false, potion: false, relic: false }, // touch button presses this frame
  atk: null, // pointer id holding the touch attack button
  padPrev: [],
  init(canvas) {
    addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      const k = e.key.toLowerCase();
      if (!this.keys.has(k)) this.pressed.add(k);
      this.keys.add(k); this.last = 'kb';
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab'].includes(k)) e.preventDefault();
    });
    addEventListener('keyup', e => this.keys.delete(e.key.toLowerCase()));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.l = this.mouse.r = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    // iOS ignores user-scalable=no; eating raw touch events on the canvas stops double-tap zoom
    for (const ev of ['touchstart', 'touchend', 'touchmove']) canvas.addEventListener(ev, e => e.preventDefault(), { passive: false });
    for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
    canvas.addEventListener('pointerdown', e => {
      Snd.init();
      if (e.pointerType === 'touch') { this.touchDown(e); return; }
      this.last = 'kb';
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      if (e.button === 0) this.mouse.l = true;
      if (e.button === 2) { this.mouse.r = true; this.mouse.rPressed = true; }
    });
    addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') { this.touchMove(e); return; }
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
    });
    const up = e => {
      if (e.pointerType === 'touch') { this.touchUp(e); return; }
      if (e.button === 0) this.mouse.l = false;
      if (e.button === 2) this.mouse.r = false;
    };
    addEventListener('pointerup', up); addEventListener('pointercancel', up);
  },
  // Touch layout: buttons bottom-right, left half = move stick, right half = aim/attack stick
  touchButtons() {
    const w = innerWidth, s = Math.min(w, innerHeight), A = s * 0.115, h = innerHeight;
    return [
      { id: 'attack', x: w - A * 1.35, y: h - A * 1.35, r: A },
      { id: 'roll', x: w - A * 3.5, y: h - A * 1.12, r: A * 0.88 },
      { id: 'swap', x: w - A * 1.15, y: h - A * 3.3, r: A * 0.8 },
      { id: 'use', x: w - A * 3.05, y: h - A * 2.75, r: A * 0.6 },
      { id: 'bag', x: w - A * 3.05, y: h - A * 4.05, r: A * 0.55 },
      { id: 'potion', x: w - A * 4.95, y: h - A * 0.9, r: A * 0.5 },
      { id: 'relic', x: w - A * 4.75, y: h - A * 2.3, r: A * 0.5 },
      { id: 'pause', x: w - s * 0.06, y: s * 0.06 + 4, r: s * 0.042 },
    ];
  },
  touchDown(e) {
    this.last = 'touch';
    const x = e.clientX, y = e.clientY;
    for (const b of this.touchButtons()) {
      if (b.id === 'bag' && !World.canBag()) continue; // only there when something can go in the bag
      if (d2(x, y, b.x, b.y) < (b.r * 1.15) ** 2) {
        if (b.id === 'pause') Game.togglePause(); else if (b.id === 'attack') this.atk = e.pointerId; else { this.tbtn[b.id] = true; if (b.id === 'use') this.useId = e.pointerId; }
        return;
      }
    }
    const side = x < innerWidth * 0.5 ? 'L' : 'R';
    if (!this.sticks[side]) this.sticks[side] = { id: e.pointerId, ox: x, oy: y, x, y };
  },
  touchMove(e) {
    for (const s of ['L', 'R']) { const st = this.sticks[s]; if (st && st.id === e.pointerId) { st.x = e.clientX; st.y = e.clientY; } }
  },
  touchUp(e) {
    if (this.atk === e.pointerId) this.atk = null;
    if (this.useId === e.pointerId) this.useId = null;
    for (const s of ['L', 'R']) { const st = this.sticks[s]; if (st && st.id === e.pointerId) this.sticks[s] = null; }
  },
  stickVec(st, max) {
    if (!st) return { x: 0, y: 0, m: 0 };
    let dx = st.x - st.ox, dy = st.y - st.oy; const l = Math.hypot(dx, dy);
    if (l > max) { st.ox = st.x - dx / l * max; st.oy = st.y - dy / l * max; dx = dx / l * max; dy = dy / l * max; }
    const m = Math.min(1, l / max);
    return { x: l ? dx / l * m : 0, y: l ? dy / l * m : 0, m };
  },
  pads() { return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; },
  // Read one player's controls. src: 'auto' follows the last-used device (solo); 'pad0'.. for co-op later.
  read(src, player) {
    if (src && src.startsWith('net')) return Coop.netInput(+src.slice(3));
    const out = { mx: 0, my: 0, aim: null, attack: false, roll: false, swap: false, use: false, potion: false, relic: false, device: 'kb' };
    let dev = src;
    if (src === 'auto') {
      const p = this.pads()[0];
      if (p && (p.buttons.some(b => b.pressed) || p.axes.some(a => Math.abs(a) > 0.4))) this.last = 'pad';
      dev = this.last === 'pad' ? 'pad0' : this.last;
    }
    out.device = dev.startsWith('pad') ? 'pad' : dev;
    if (dev === 'kb') {
      const k = this.keys;
      out.mx = (k.has('d') || k.has('arrowright') ? 1 : 0) - (k.has('a') || k.has('arrowleft') ? 1 : 0);
      out.my = (k.has('s') || k.has('arrowdown') ? 1 : 0) - (k.has('w') || k.has('arrowup') ? 1 : 0);
      const l = Math.hypot(out.mx, out.my); if (l > 1) { out.mx /= l; out.my /= l; }
      const wp = Render.screenToWorld(this.mouse.x, this.mouse.y);
      out.aim = Math.atan2(wp.y - player.y, wp.x - player.x);
      out.attack = this.mouse.l;
      out.roll = this.pressed.has(' ') || this.pressed.has('shift') || this.mouse.rPressed;
      out.swap = this.pressed.has('q') || this.pressed.has('tab');
      out.use = this.pressed.has('e'); out.useHeld = this.keys.has('e'); out.bag = this.pressed.has('v');
      out.potion = this.pressed.has('r'); out.relic = this.pressed.has('f');
    } else if (dev === 'touch') {
      const max = Math.min(innerWidth, innerHeight) * 0.09;
      const L = this.stickVec(this.sticks.L, max), Rv = this.stickVec(this.sticks.R, max);
      out.mx = L.x; out.my = L.y;
      if (Rv.m > 0.15) { out.aim = Math.atan2(Rv.y, Rv.x); out.attack = true; out.assist = true; }
      else if (this.atk !== null) { out.attack = true; out.autoAim = true; }
      out.roll = this.tbtn.roll; out.swap = this.tbtn.swap; out.use = this.tbtn.use; out.useHeld = this.useId != null; out.bag = this.tbtn.bag; out.potion = this.tbtn.potion; out.relic = this.tbtn.relic;
    } else {
      const p = this.pads()[+dev.slice(3)] || null;
      if (p) {
        const dz = v => Math.abs(v) < 0.18 ? 0 : v;
        out.mx = dz(p.axes[0]); out.my = dz(p.axes[1]);
        const ax = dz(p.axes[2]), ay = dz(p.axes[3]);
        if (Math.hypot(ax, ay) > 0.3) out.aim = Math.atan2(ay, ax), out.assist = true;
        const btn = i => p.buttons[i] && p.buttons[i].pressed;
        const prev = this.padPrev[p.index] || [];
        const tap = i => btn(i) && !prev[i];
        out.attack = btn(7) || btn(5) || (out.aim !== null && Math.hypot(ax, ay) > 0.6);
        out.roll = tap(0) || tap(6);
        out.swap = tap(3); out.use = tap(2); out.useHeld = btn(2); out.bag = tap(13); out.potion = tap(1); out.relic = tap(4);
        if (tap(9)) Game.togglePause();
      }
    }
    return out;
  },
  endFrame() {
    this.pressed.clear(); this.mouse.rPressed = false;
    this.tbtn.roll = this.tbtn.swap = this.tbtn.use = this.tbtn.potion = this.tbtn.relic = this.tbtn.bag = false;
    for (const p of this.pads()) this.padPrev[p.index] = p.buttons.map(b => b.pressed);
  },
};

// ===== Audio: everything synthesized, no sound files =====
const Snd = {
  ctx: null, master: null, sfxBus: null, musBus: null, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = Meta.data.muted ? 0 : 0.8; this.master.connect(c.destination);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.55; this.sfxBus.connect(this.master);
    this.musBus = c.createGain(); this.musBus.gain.value = 0.32; this.musBus.connect(this.master);
    const n = c.sampleRate; this.noiseBuf = c.createBuffer(1, n, n);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    Music.boot();
  },
  setMuted(m) { Meta.data.muted = m; Meta.save(); if (this.master) this.master.gain.value = m ? 0 : 0.8; },
  tone(f, dur, type = 'square', vol = 0.2, slide = 0, delay = 0, bus) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, freq = 2000, q = 1, delay = 0, sweep = 0, bus) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * sweep), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || this.sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  last: {},
  play(name) {
    if (!this.ctx) return;
    const now = performance.now(); if (now - (this.last[name] || 0) < 35) return; this.last[name] = now;
    const r = 1 + (Math.random() - 0.5) * 0.12;
    switch (name) {
      case 'swing': this.noise(0.13, 0.22, 1800 * r, 2, 0, 2.6); break;

// Seeded generative music: a minor-key loop that thickens when a fight starts
const Music = {
  on: false, step: 0, next: 0, intensity: 0, target: 0, seed: 1, timer: null,
  boot() { if (this.timer) return; this.timer = setInterval(() => this.tick(), 30); },
  setSeed(s) {
    this.seed = s; const rng = RNG(hash(s, 777));
    const roots = [110, 116.54, 123.47, 130.81, 98, 103.83];
    this.root = rng.pick(roots);
    const scales = [[0, 3, 5, 7, 10], [0, 2, 3, 7, 8], [0, 3, 5, 6, 7, 10]];
    this.scale = rng.pick(scales);
    this.arp = Array.from({ length: 16 }, () => rng.chance(0.75) ? rng.int(0, this.scale.length * 2 - 1) : -1);
    this.bass = Array.from({ length: 16 }, (_, i) => i % 4 === 0 ? rng.pick([0, 0, 3, 4, -2]) : (rng.chance(0.2) ? rng.pick([0, 2]) : null));
    this.prog = [0, rng.pick([3, 5, 8]), rng.pick([5, 7, 10]), rng.pick([3, 7])];
  },
  note(deg, oct = 0) {
    const n = this.scale.length, o = Math.floor(deg / n) + oct, i = ((deg % n) + n) % n;
    return this.root * Math.pow(2, o + this.scale[i] / 12);
  },
  tick() {
    const c = Snd.ctx; if (!c || !this.on || !this.scale) return;
    this.intensity = lerp(this.intensity, this.target, 0.02);
    const spb = 60 / 104 / 4;
    if (this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.12) {
      const s = this.step % 16, bar = Math.floor(this.step / 16) % 4, t = this.next - c.currentTime;
      const shift = Math.pow(2, this.prog[bar] / 12);
      const b = this.bass[s];
      if (b !== null) this.voice(this.note(b, -1) * shift, spb * 3.5, 'triangle', 0.22, t);
      if (s === 0) this.voice(this.note(0, 0) * shift, spb * 15, 'sine', 0.05, t), this.voice(this.note(2, 0) * shift, spb * 15, 'sine', 0.035, t);
      const a = this.arp[s];
      if (a >= 0 && (this.intensity > 0.3 || s % 2 === 0)) this.voice(this.note(a, 1) * shift, spb * 1.6, 'square', 0.025 + 0.02 * this.intensity, t);
      if (this.intensity > 0.4) {
        if (s % 4 === 0) Snd.noise(0.12, 0.18 * this.intensity, 120, 1, t, 0.5, Snd.musBus);
        if (s % 4 === 2) Snd.noise(0.05, 0.08 * this.intensity, 7000, 1, t, 1, Snd.musBus);
        if (s === 4 || s === 12) Snd.noise(0.12, 0.12 * this.intensity, 1500, 0.8, t, 0.6, Snd.musBus);
      }
      this.step++; this.next += spb;
    }
  },
  voice(f, dur, type, vol, delay) { Snd.tone(f, dur, type, vol, 0, delay, Snd.musBus); },
};

// Rarity odds by depth (1-9) and source. Legendary is gated to later worlds and bosses.
function rollRarity(rng, depth, src = 'room') {
  const d = depth;
  // gray fades fast: by the second level of a run Uncommon is as likely, and mostly takes over after that
  const w = [Math.max(8, 50 - 14 * (d - 1)), 30 + 3 * d, 6 + 2.2 * d, d <= 1 ? 0.6 : 0.8 + 1.1 * (d - 1), d < 4 ? 0 : 0.25 * (d - 3)];
  if (src === 'boss') { w[0] *= 0.4; w[3] += 6; if (d >= 3) w[4] += 2 + d * 0.6; }
  if (src === 'armory') { w[0] = 0; w[2] += 6; }
  if (src === 'chest') { w[0] = 0; w[3] += 3; if (d >= 4) w[4] += 0.6; }
  if (Meta.has('luck')) { w[2] *= 1.4; w[3] *= 1.4; w[4] *= 1.4; }
  const rm = (Game.diff && Game.diff.rare) || 1; w[2] *= rm; w[3] *= rm; w[4] *= rm;
  let tot = w.reduce((a, b) => a + b, 0), r = rng() * tot;
  for (let i = 0; i < 5; i++) { r -= w[i]; if (r <= 0) return i; }

function pickWeaponType(rng) {
  const mine = CLASSES[Game.cls || 'fighter'].cat, others = ['melee', 'ranged', 'magic'].filter(c => c !== mine);
  const cat = rng.chance(0.6) ? mine : rng.pick(others);

// Build a weapon from a seed. Everything about it comes out of the rng.
function makeWeapon(rng, opts = {}) {
  const type = opts.type || pickWeaponType(rng);
  const B = WBASE[type];
  let rar = opts.rarity !== undefined ? opts.rarity : rollRarity(rng, opts.depth || 1, opts.src);
  if (Game.mods.allLegendary) rar = 4;
  const R0 = RARITY[rar];
  const w = { type, cat: B.cat, rarity: rar, crit: B.crit, quirks: [], uid: Math.random().toString(36).slice(2, 10) };
  if (type === 'spellbook') {
    w.spell = opts.spell || rng.pick(Object.keys(SPELLS));
    const S = SPELLS[w.spell]; w.elem = S.elem; w.dmg = rng.range(...S.dmg) * R0.m; w.cd = rng.range(...S.cd);
  } else {
    w.dmg = rng.range(...B.dmg) * R0.m; w.cd = rng.range(...B.cd);
    const elemChance = [0.15, 0.35, 0.55, 1, 1][rar] + (B.cat === 'magic' ? 0.4 : 0);
    w.elem = opts.elem || (rng.chance(elemChance) ? rng.pick(['fire', 'frost', 'storm', 'arcane']) : 'none');
  }
  if (B.reach) { w.reach = rng.range(...B.reach); w.arc = rng.range(...B.arc) * Math.PI / 180; }
  if (B.charge) w.charge = rng.range(...B.charge);
  if (B.speed) w.speed = rng.range(...B.speed);
  if (B.spread) w.spread = rng.range(...B.spread);
  const nq = rar >= 4 ? 3 : rar === 3 ? 2 : rar === 2 ? (rng.chance(0.4) ? 2 : 1) : rar === 1 ? 1 : 0;
  const pool = rng.shuffle(QUIRKS.filter(q => q.t.includes(type)));
  for (let i = 0; i < nq && i < pool.length; i++) w.quirks.push(pool[i].id);
  if (w.quirks.includes('heavy')) { w.dmg *= 1.35; w.cd *= 1.3; }
  // item level: where it dropped. Deeper finds hit harder, so even a gray from 3-1 beats one from 1-1
  w.ilvl = opts.ilvl || opts.depth || 1; w.dmg *= 1 + 0.06 * (w.ilvl - 1);
  if (w.quirks.includes('swift')) w.cd /= 1.3;
  if (w.quirks.includes('keen')) w.crit += 0.15;
  const base = rng.pick(B.names), el = ELEM[w.elem].n;

  else if (rar === 4) w.name = `${properName(rng)}, ${el ? el + ' ' : ''}${base}`;
  else {

    w.name = `${el ? el + ' ' : ''}${base}${q ? ' ' + q.suf : ''}`;
  }
  return w;
}

    const link = (a, b) => { a.links.push(b.id); b.links.push(a.id); };
    // ---- layout: a start, an exit, and two or three routes between them, with a few side rooms off the routes.
    // Route types: horde (more foes), gauntlet (heavy hazards), elite (a champion). Signposted at the start room.
    const K = (x, y) => x + ',' + y;
    const flipX = rng.chance(0.5), flipY = rng.chance(0.5), turn = rng.chance(0.5); // vary the orientation run to run

const Game = {
  state: 'menu', seed: '', seedNum: 0, mods: {}, cls: 'fighter', secret: null, hs: 0, runEmbers: 0, runTime: 0, bannerData: null, deadT: 0,
  hitstop(t) { this.hs = Math.max(this.hs, t); },
  banner(title, sub, dur = 2) { this.bannerData = { title, sub, dur, t: 0 }; },
  // Difficulty per mode. Quick-play is lighter and loot-rich; Campaign is a gear check.
  DIFF: {
    quick: { hp: 1.7, boss: 1, shot: 1, loot: 1.4, rare: 1.2 },
    campaign: { hp: 1.6, boss: 1.5, shot: 1.1, loot: 0.5, rare: 0.6 },
  },
  mode: 'quick', char: null, diff: null, runXp: 0,
  newRun(seedStr, cls, opts = {}) {
    Snd.init(); Screen.goFull();
    this.mode = opts.campaign ? 'campaign' : 'quick';
    if (!opts.campaign) this.char = null;
    this.diff = this.DIFF[this.mode];
    this.cls = cls || Meta.data.lastClass || 'fighter';
    if (this.mode === 'quick') { if (this.cls !== 'fighter' && !Meta.has(this.cls) && !Dev.on && !(Coop.on && Coop.host)) this.cls = 'fighter'; Meta.data.lastClass = this.cls; }

    this.seedNum = strHash(this.seed);
    const sec = this.mode === 'quick' ? SECRETS[this.seedNum] : null;
    this.secret = sec || null; this.mods = sec ? { ...sec.mods } : {};
    this.bag = { weapons: [], relics: [] }; // campaign Void Bag: banks on a win, rides with your corpse
    this.runEmbers = 0; this.runXp = 0; this.runTime = 0; this.deadT = 0; this.hs = 0; this.keysSpawned = 0; this.chestsSpawned = 0;
    Meta.data.stats.runs++; Meta.save();
    Music.setSeed(this.seedNum); Music.on = true;
    World.startLevel(opts.world || 1, 1);
    if (sec) {
      const first = !Meta.data.secrets[this.seed];
      if (first) { Meta.data.secrets[this.seed] = sec.n; Meta.data.embers += 25; Meta.save(); }
      setTimeout(() => this.banner('Secret Seed: ' + sec.n, sec.d + (first ? '  (+25 embers)' : ''), 3.4), 2700);

    Meta.data.embers += this.runEmbers;

function statBlock(p) {

  const rows = [
    ['Class', C.n], ['Hearts', `${p.hp / 2} / ${p.maxHp / 2}`],
    ['Move speed', pct(st.speed / 155 - 1)], ['Attack speed', pct(st.rate - 1)],
    ['Damage', pct(st.dmg - 1)], ['Melee damage', pct(st.meleeDmg - 1)],
    ['Ranged damage', pct(st.rangedDmg - 1)], ['Bow draw time', pct(st.draw - 1)],
    ['Crit chance', Math.round(((p.weapons[p.wi].crit || 0) + st.crit) * 100) + '%'], ['Crit damage', Math.round(st.critMult * 100) + '%'],
    [p.cls === 'mage' ? 'Blink cooldown' : 'Roll cooldown', (st.rollCd + (p.cls === 'mage' ? 0.5 : 0.34)).toFixed(2) + 's'], ['Mana', `${Math.round(p.maxMana)} · regen ${Math.round(p.manaRegen * 100)}%`],
    ['Extra projectiles', st.extraShots], ['Bounces', st.bounce],
    ['Damage taken', st.hurtMult > 1 ? 'x' + st.hurtMult : 'normal'], ['Keys', p.keys],
    ['Potion', p.potion ? potionById(p.potion).n : '-'], ['Relic', p.relic ? relicById(p.relic).n : '-'],
  ];
  return rows.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('');
}
function fmtTime(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// ===== Shop stock (limited, reshuffled after each run) =====
const Shop = {
  ensure() { if (!Meta.data.shop) this.reroll(); },
  reroll() {
    const rng = RNG((Math.random() * 4294967296) >>> 0);
    Meta.data.shop = { potions: rng.shuffle(POTIONS.map(x => x.id)).slice(0, 3), relics: rng.shuffle(RELICS.map(x => x.id)).slice(0, 2) };
  },

// ===== New-version check: compare our build stamp with the one on the server =====
const Updater = {
  pending: false,
  async check() {
    if (location.protocol === 'file:' || this.pending) return;
    try {
      const txt = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
      const m = txt.match(/const BUILD = (\d+)/);
      if (m && +m[1] > BUILD) { this.pending = true; this.show(); }
    } catch (e) { }
  },
  show() {
    if (document.getElementById('upd')) return;
    const b = document.createElement('button'); b.id = 'upd';
    b.textContent = 'New version available. Tap to reload';
    b.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:20px;border:1px solid #ffb057;background:#2d2150;color:#ffe2b0;font:700 14px ui-rounded,system-ui,sans-serif;box-shadow:0 0 16px rgba(255,150,60,.35)';
    b.onclick = () => location.reload();
    document.body.appendChild(b);
  },
};
setTimeout(() => Updater.check(), 3000);
setInterval(() => { if (Game.state !== 'play') Updater.check(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) Updater.check(); });


// ===== Campaign: persistent heroes, stash, loadout, world unlocks, corpse runs =====
const SCRAP = [5, 15, 40, 100, 250]; // embers for scrapping a weapon, by rarity
// XP curve v2: about one level per world clear early on, slowing down after that
const xpNeed = lvl => Math.round(100 * Math.pow(lvl, 1.6));
const xpNeedV1 = lvl => Math.round(80 * Math.pow(lvl, 1.35));
// Each world has a level band. XP tapers near the top so easy worlds can't be farmed for levels.
const XP_BANDS = [null, 3, 6, 10, 14]; // top level of each world's band
function xpMult(lvl, world) { const top = XP_BANDS[world]; return lvl >= top ? 0.05 : lvl === top - 1 ? 0.5 : 1; }
function migrateHero(h) { // heroes made on the old, faster curve get re-leveled from their total XP
  if (!h || h.xpv === 2) return;
  let total = h.xp; for (let l = 1; l < h.lvl; l++) total += xpNeedV1(l);
  total = Math.round(total * 0.45); // XP per kill was also cut, so scale old XP to match
  h.lvl = 1; while (total >= xpNeed(h.lvl)) { total -= xpNeed(h.lvl); h.lvl++; }
  h.xp = total; h.xpv = 2;
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

const Campaign = {
  data() { const M = Meta.data; if (!M.camp) M.camp = { slots: [null, null, null] }; for (const h of M.camp.slots) migrateHero(h); return M.camp; },
  hero(i) { return this.data().slots[i]; },
  create(i, name, cls) {
    const rng = RNG((Math.random() * 4294967296) >>> 0), C = CLASSES[cls];
    const weapons = C.kit.map(k => makeWeapon(rng, { type: k.type, spell: k.spell, rarity: 0, elem: k.type === 'wand' || k.type === 'spellbook' ? undefined : 'none', name: k.name }));
    const h = { name: name || C.n, cls, lvl: 1, xp: 0, xpv: 2, embers: 0, unlocks: {}, stash: { weapons, relics: [], potions: [] }, load: { w: weapons.map(w => w.uid), relic: null, potion: null }, cleared: 0, corpse: null, shop: null, stats: { runs: 0, deaths: 0, kills: 0, clears: 0 } };
    this.data().slots[i] = h; Meta.save(); return h;
  },
  cap(h) { const x = h.unlocks.armory ? 1 : 0; return { w: 20 + 10 * x, r: 8 + 4 * x }; },
  loadoutWeapons(h) {
    const pick = h.load.w.map(u => h.stash.weapons.find(w => w.uid === u)).filter(Boolean);
    for (const w of h.stash.weapons) if (pick.length < 2 && !pick.includes(w)) pick.push(w);
    return pick.slice(0, 2).map(w => JSON.parse(JSON.stringify(w)));
  },
  start(i, world, useCorpse) {
    const h = this.hero(i); Game.char = h; Game.charIdx = i;
    if (!useCorpse && h.corpse && h.corpse.world === world) h.corpse = null; // a fresh dungeon abandons your remains
    const seed = useCorpse && h.corpse ? h.corpse.seed : randomSeed();
    Game.loadPotion = h.load.potion; Game.loadRelic = h.load.relic;
    h.stats.runs++; Meta.save();
    Game.newRun(seed, h.cls, { campaign: true, world });
  },
  // End of a campaign run: embers and XP always stick; new gear only if you beat the world boss
  finish(won) {
    const h = Game.char, p = World.players[0], W = World.world;
    const res = { won, embers: Game.runEmbers, xp: Game.runXp, levels: 0, banked: [], lost: [] };
    h.embers += Game.runEmbers; h.stats.kills += p.kills;
    let raw = Game.runXp, gained = 0; // apply XP level by level, since the taper depends on the level you're at
    while (raw > 0) {
      const m = xpMult(h.lvl, W), need = xpNeed(h.lvl) - h.xp;
      if (raw * m >= need) { raw -= need / m; gained += need; h.xp = 0; h.lvl++; res.levels++; }
      else { h.xp += raw * m; gained += raw * m; raw = 0; }
    }
    h.xp = Math.round(h.xp); res.xp = Math.round(gained); res.xpNote = xpMult(h.lvl, W) < 1 ? (xpMult(h.lvl, W) <= 0.05 ? `${WORLDS[W].n} no longer grants XP at your level` : `${WORLDS[W].n} grants reduced XP at your level`) : '';
    if (Game.loadPotion && p.potion !== Game.loadPotion) { // the packed potion got drunk (or swapped away)
      const i = h.stash.potions.indexOf(Game.loadPotion); if (i >= 0) h.stash.potions.splice(i, 1);
      if (!h.stash.potions.includes(h.load.potion)) h.load.potion = null;
    }
    const have = new Set(h.stash.weapons.map(w => w.uid));
    const newW = p.weapons.filter(w => !have.has(w.uid));
    const newRelic = p.relic && !h.stash.relics.includes(p.relic) ? p.relic : null;
    const newPotion = p.potion && p.potion !== Game.loadPotion ? p.potion : null;
    const bag = Game.bag || { weapons: [], relics: [] };
    const allW = newW.concat(bag.weapons), allR = (newRelic ? [newRelic] : []).concat(bag.relics);
    if (won) {
      for (const w of allW) { h.stash.weapons.push(w); res.banked.push(w.name); }
      for (const id of allR) { h.stash.relics.push(id); res.banked.push(relicById(id).n); }
      if (newPotion) { h.stash.potions.push(newPotion); res.banked.push(potionById(newPotion).n); }
      h.load.w = p.weapons.map(w => w.uid); // next run starts with what you finished with
      h.load.relic = p.relic || null; if (newPotion) h.load.potion = newPotion;
      res.unlocked = W >= h.cleared + 1 && W < WORLD_COUNT ? WORLDS[W + 1].n : null;

    } else {
      h.stats.deaths++;
      if (allW.length || allR.length || newPotion) {
        h.corpse = { seed: Game.seed, world: W, stage: World.level, x: p.x, y: p.y, loot: { weapons: allW, relics: allR, potion: newPotion } };
        res.lost = allW.map(w => w.name).concat(allR.map(id => relicById(id).n), newPotion ? [potionById(newPotion).n] : []);
      }
    }
    h.shop = null; Meta.save();
    Menu.show('campDone', res);
  },
  shopStock(h) {
    if (!h.shop) { const rng = RNG((Math.random() * 4294967296) >>> 0); h.shop = { potions: rng.shuffle(POTIONS.map(x => x.id)).slice(0, 3), relics: rng.shuffle(RELICS.map(x => x.id)).slice(0, 2) }; Meta.save(); }
    return h.shop;
  },
};

// ===== Quick-play merchant: spend this run's embers between stages =====
const Merchant = {
  stock(depth) {
    const rng = RNG(hash(Game.seedNum, depth, 919));
    const ps = rng.shuffle(POTIONS.slice()).slice(0, 2).map(P => ({ kind: 'potion', id: P.id, price: Math.round(P.cost * 0.5) }));
    const Rl = rng.pick(RELICS), w = makeWeapon(rng, { depth, src: 'armory' });
    const minors = rng.shuffle(MINORS.slice()).slice(0, 2).map(m => ({ kind: 'minor', id: m.id, price: 18 + 4 * depth }));
    return [{ kind: 'sharpen', price: 0, repeat: true }].concat(ps, minors, [{ kind: 'relic', id: Rl.id, price: Math.round(Rl.cost * 0.4) }, { kind: 'weapon', w, price: [30, 50, 90, 150, 260][w.rarity] }]);
  },
};

    st.forEach((it, k) => Menu.on('m-' + k, () => {

      Game.runEmbers -= it.price; it.sold = true; Snd.play('item');

      Menu.show('merchant');
    }));
    Menu.on('b-leave', () => { Game.state = 'play'; Menu.hide(); });

// ===== Developer mode =====
// Type the phrase into the seed box to switch it on. Dev mode runs on its own sandbox save
// (a copy of your real one), so nothing you do here touches your real heroes or embers.
const DEV_HASH = strHash('POWEROVERWHELMIN'); // the seed box keeps 16 letters
const Dev = {
  on: false,
  opt: { god: false, oneHit: false, mana: false, dmgNums: false, hitboxes: false, stats: false, speed: 1 },
  run: { mode: 'quick', cls: 'fighter', hero: 0, world: 1, level: 1, boss: '', atBoss: false, keepLoad: true,
    w: [{ type: 'sword', rarity: 2, elem: '', spell: '' }, { type: 'bow', rarity: 2, elem: '', spell: '' }], relic: '', potion: '', items: [] },
  init() {
    try {
      this.on = localStorage.getItem('emberdeep.devmode') === '1';
      Object.assign(this.opt, JSON.parse(localStorage.getItem('emberdeep.devopt') || '{}'));
      Object.assign(this.run, JSON.parse(localStorage.getItem('emberdeep.devrun') || '{}'));
    } catch (e) { }
  },
  saveOpt() { try { localStorage.setItem('emberdeep.devopt', JSON.stringify(this.opt)); localStorage.setItem('emberdeep.devrun', JSON.stringify(this.run)); } catch (e) { } },
  isCode(s) { return strHash(normSeed(s)) === DEV_HASH; },
  enter() {
    try { if (!localStorage.getItem('emberdeep.dev')) localStorage.setItem('emberdeep.dev', localStorage.getItem('emberdeep.v1') || '{}'); localStorage.setItem('emberdeep.devmode', '1'); } catch (e) { }
    location.reload();
  },
  exit() { try { localStorage.removeItem('emberdeep.devmode'); } catch (e) { } location.reload(); },
  resetSandbox() { try { localStorage.setItem('emberdeep.dev', localStorage.getItem('emberdeep.v1') || '{}'); } catch (e) { } location.reload(); },
  active(k) { return this.on && this.opt[k] && !(typeof Coop !== 'undefined' && Coop.on); }, // dev cheats are solo only

  weapon(s) {
    const w = makeWeapon(RNG((Math.random() * 1e9) | 0), { type: s.type, rarity: +s.rarity, elem: s.elem || undefined, spell: s.spell || undefined });
    return w;
  },
  allBosses() { const out = []; for (let w = 1; w <= WORLD_COUNT; w++) for (const B of WORLDS[w].bosses) out.push({ w, id: B.id, n: B.title }); return out; },

  // ---------- starting a test run ----------
  start() {
    const R = this.run; this.saveOpt();
    Game.devBoss = R.boss || null;
    if (R.boss) { const b = this.allBosses().find(b => b.id === R.boss); if (b) { R.world = b.w; R.level = 3; } }
    const w = +R.world, l = +R.level;
    if (R.mode === 'campaign' && Campaign.hero(+R.hero)) Campaign.start(+R.hero, w, false);
    else Game.newRun(randomSeed(), R.cls, { world: w });
    if (l > 1) World.startLevel(w, l, true);
    const p = World.players[0];
    if (R.mode !== 'campaign' || !R.keepLoad) {
      const ws = R.w.filter(s => s.type).map(s => this.weapon(s)); if (ws.length) { p.weapons = ws; p.wi = 0; }
      p.relic = R.relic || null; p.potion = R.potion || null;
    }
    for (const id of R.items) { const it = ITEMS.find(x => x.id === id); if (it) World.giveItem(p, it); }
    World.recalc(p);
    if (R.atBoss && l === 3) this.toBoss();
  },
  toBoss() {
    const r = World.rooms.find(r => r.type === 'boss' || r.type === 'exit'), p = World.players[0]; if (!r) return;
    const s = World.freeSpot(r.mx * T + T / 2, (r.my + 4) * T + T / 2); p.x = s.x; p.y = s.y;
  },

  // ---------- in-run helpers ----------
  killRoom() { const p = World.players[0]; for (const e of World.enemies) if (!e.dead && !e.boss) World.damage(e, 1e9, { x: e.x, y: e.y, p, blunt: true }); for (const r of World.rooms) if (r === World.room && r.waves) r.waves.length = 0; },
  killBoss() { const b = World.boss; if (b && !b.dead) { b.phase = 9; World.damage(b, 1e9, { x: b.x, y: b.y, p: World.players[0], blunt: true }); } },
  revealMap() { for (const r of World.rooms) { r.known = true; r.visited = true; } },
  nextLevel() { const w = World.world, l = World.level; if (l < 3) World.startLevel(w, l + 1, true); else if (w < WORLD_COUNT) World.startLevel(w + 1, 1, true); },
  heal() { const p = World.players[0]; p.hp = p.maxHp; p.mana = p.maxMana; p.exhausted = false; },
  spawn(type) { const p = World.players[0], a = Math.random() * TAU, s = World.freeSpot(p.x + Math.cos(a) * 140, p.y + Math.sin(a) * 140), e = World.makeEnemy(type, s.x, s.y); World.enemies.push(e); },
  dropWeapon(s) { const p = World.players[0]; World.pickups.push({ kind: 'weapon', w: this.weapon(s), x: p.x + 40, y: p.y, t: 0 }); },

  // ---------- menus ----------
  sel(id, opts, val) { return `<select class="dsel" id="${id}">${opts.map(([v, n]) => `<option value="${v}"${String(v) === String(val) ? ' selected' : ''}>${n}</option>`).join('')}</select>`; },
  bindSel(id, fn) { const el = document.getElementById(id); if (el) el.onchange = () => fn(el.value); },
  check(id, label, on) { return `<label class="dchk"><input type="checkbox" id="${id}"${on ? ' checked' : ''}> ${label}</label>`; },
  bindCheck(id, fn) { const el = document.getElementById(id); if (el) el.onchange = () => fn(el.checked); },
  wOpts() { return Object.keys(WBASE).map(t => [t, t]); },
  rOpts() { return RARITY.map((r, i) => [i, r.n]); },
  eOpts() { return [['', 'any element'], ...Object.keys(ELEM).map(k => [k, k])]; },
  sOpts() { return [['', 'any spell'], ...Object.keys(SPELLS).map(k => [k, SPELLS[k].n])]; },
  builder(pre, s) {
    return `<div class="drow">${this.sel(pre + 't', [['', '(none)'], ...this.wOpts()], s.type)}${this.sel(pre + 'r', this.rOpts(), s.rarity)}${s.type === 'spellbook' ? this.sel(pre + 's', this.sOpts(), s.spell) : this.sel(pre + 'e', this.eOpts(), s.elem)}</div>`;
  },
  bindBuilder(pre, s, redraw) {
    this.bindSel(pre + 't', v => { s.type = v; redraw(); }); this.bindSel(pre + 'r', v => s.rarity = +v);
    this.bindSel(pre + 'e', v => s.elem = v); this.bindSel(pre + 's', v => s.spell = v);
  },

// ===== Netplay =====
// Star layout: one host runs the game, up to two guests send inputs and get state back.
// Devices talk directly over WebRTC. They only need a go-between for the opening handshake:
// a public PeerJS signaling server when there's internet, or QR codes passed between screens when there isn't.
const Net = {
  MAX: 3,
  ICE: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }],
  role: null, code: '', P: null, peers: [], status: '', onMsg: null, onChange: null,

  reset() {
    for (const p of this.peers) try { p.pc && p.pc.close(); } catch (e) { }
    this.peers = []; this.role = null; this.code = ''; this.status = '';
    if (this.P) try { this.P.destroy(); } catch (e) { }
    this.P = null;
  },
  changed() { if (this.onChange) this.onChange(); },
  say(s) { this.status = s; this.changed(); },

  // ---------- WebRTC plumbing ----------
  newPeer(slot) {
    const pc = new RTCPeerConnection({ iceServers: this.ICE });
    // two channels: reliable for events, fast (no resends) for state that's stale in 50 ms anyway
    const rel = pc.createDataChannel('rel', { negotiated: true, id: 0, ordered: true });
    const fast = pc.createDataChannel('fast', { negotiated: true, id: 1, ordered: false, maxRetransmits: 0 });
    const peer = { pc, rel, fast, slot, rtt: 0, link: '…', open: false, last: performance.now() };
    const onmsg = e => { peer.last = performance.now(); let m; try { m = JSON.parse(e.data); } catch (_) { return; } this.handle(peer, m); };
    rel.onmessage = onmsg; fast.onmessage = onmsg;
    rel.onopen = () => { peer.open = true; this.say('Connected'); this.linkType(peer); };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === 'failed' || s === 'closed' || s === 'disconnected') { peer.open = false; if (s !== 'disconnected') this.drop(peer); else this.changed(); }
    };
    return peer;
  },
  gathered(pc, ms = 3000) { // wait for ICE candidates so one message carries everything (works for QR too)
    return new Promise(res => {
      if (pc.iceGatheringState === 'complete') return res();
      const t = setTimeout(res, ms);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
  },
  async offer(peer) { await peer.pc.setLocalDescription(await peer.pc.createOffer()); await this.gathered(peer.pc); return peer.pc.localDescription.sdp; },
  async answer(peer, sdp) { await peer.pc.setRemoteDescription({ type: 'offer', sdp }); await peer.pc.setLocalDescription(await peer.pc.createAnswer()); await this.gathered(peer.pc); return peer.pc.localDescription.sdp; },
  async accept(peer, sdp) { await peer.pc.setRemoteDescription({ type: 'answer', sdp }); },
  async linkType(peer) { // how the bytes actually travel
    for (let i = 0; i < 10 && peer.pc.connectionState !== 'closed'; i++) {
      try {
        const st = await peer.pc.getStats(); let pair = null; const c = {};
        st.forEach(r => { if (r.type === 'candidate-pair' && (r.nominated || r.selected) && r.state === 'succeeded') pair = r; if (r.type === 'local-candidate' || r.type === 'remote-candidate') c[r.id] = r; });
        if (pair) { const L = c[pair.localCandidateId] || {}, Rm = c[pair.remoteCandidateId] || {}; peer.link = L.candidateType === 'relay' || Rm.candidateType === 'relay' ? 'relayed' : L.candidateType === 'host' && Rm.candidateType === 'host' ? 'direct, local network' : 'direct, over internet'; this.changed(); return; }
      } catch (e) { }
      await new Promise(r => setTimeout(r, 500));
    }
  },
  freeSlot() { for (let s = 1; s < this.MAX; s++) if (!this.peers.some(p => p.slot === s)) return s; return -1; },
  drop(peer) { try { peer.pc && peer.pc.close(); } catch (e) { } this.peers = this.peers.filter(p => p !== peer); this.changed(); },

  // ---------- messages ----------
  send(peer, m, fast) { const ch = fast ? peer.fast : peer.rel; if (ch && ch.readyState === 'open') try { ch.send(JSON.stringify(m)); } catch (e) { } },
  broadcast(m, fast) { for (const p of this.peers) this.send(p, m, fast); },
  handle(peer, m) {
    if (m.t === 'ping') return this.send(peer, { t: 'pong', tm: m.tm });
    if (m.t === 'pong') { peer.rtt = lerp(peer.rtt || (performance.now() - m.tm), performance.now() - m.tm, 0.3); return; }
    if (m.t === 'welcome') { peer.slot = m.slot; this.mySlot = m.slot; this.changed(); }
    if (m.t === 'full') { this.say('That room is full (3 players)'); }
    if (this.onMsg) this.onMsg(peer, m);
  },
  pingAll() { for (const p of this.peers) this.send(p, { t: 'ping', tm: performance.now() }); },

  // ---------- online: room codes via the public PeerJS server (official client, loaded on demand) ----------
  roomId(code) { return 'emberdeep-room-' + code.toLowerCase(); },
  // wrap a PeerJS DataConnection so it looks like a plain channel
  chan(conn) { return { get readyState() { return conn.open ? 'open' : 'closed'; }, send: s => conn.send(s) }; },
  wire(peer, conn, kind) {
    peer[kind] = this.chan(conn);
    if (kind === 'rel') peer.pc = conn.peerConnection || peer.pc;
    conn.on('data', d => { peer.last = performance.now(); let m; try { m = JSON.parse(d); } catch (_) { return; } this.handle(peer, m); });
    const opened = () => { if (kind === 'rel') { peer.open = true; peer.pc = conn.peerConnection; this.say('Connected'); this.linkType(peer); if (this.role === 'host') this.send(peer, { t: peer.full ? 'full' : 'welcome', slot: peer.slot }); } };
    if (conn.open) opened(); else conn.on('open', opened);
    conn.on('close', () => { if (kind === 'rel') { peer.open = false; this.drop(peer); } });
    conn.on('error', () => { });
  },
  async lib() { await QR.load('vendor/peerjs.min.js', 'Peer'); },
  makePeer(id) {
    return new Promise((res, rej) => {
      const P = id ? new Peer(id, { debug: 0 }) : new Peer({ debug: 0 });
      const t = setTimeout(() => rej(new Error('timeout')), 9000);
      P.on('open', () => { clearTimeout(t); res(P); });
      P.on('error', e => { clearTimeout(t); rej(e); });
    });
  },
  async host() {
    this.reset(); this.role = 'host'; this.mySlot = 0;
    try { await this.lib(); } catch (e) { this.say("Couldn't load the matchmaking code. No internet? Use QR codes."); return false; }
    for (let i = 0; i < 6; i++) {
      const code = Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[(Math.random() * 24) | 0]).join('');
      this.say('Opening a room…');
      try { this.P = await this.makePeer(this.roomId(code)); }
      catch (e) { if (e.type === 'unavailable-id') continue; this.say("Couldn't reach the matchmaking server. No internet? Use QR codes."); return false; }
      this.code = code; this.say('Waiting for players');
      this.P.on('error', () => { });
      this.P.on('connection', conn => {
        const md = conn.metadata || {}, gid = conn.peer;
        let peer = this.peers.find(p => p.gid === gid);
        if (!peer) {
          const slot = this.freeSlot();
          peer = { gid, slot: slot < 0 ? -1 : slot, full: slot < 0, rtt: 0, link: '…', open: false, last: performance.now(), pc: conn.peerConnection };
          if (!peer.full) this.peers.push(peer);
        }
        if (peer.full) { conn.on('open', () => { conn.send(JSON.stringify({ t: 'full' })); setTimeout(() => conn.close(), 500); }); return; }
        this.wire(peer, conn, md.ch === 'fast' ? 'fast' : 'rel');
        this.changed();
      });
      return true;
    }
    this.say("Couldn't open a room. Try again?"); return false;
  },
  async join(code) {
    this.reset(); this.role = 'guest'; this.code = code.toUpperCase();
    try { await this.lib(); this.say('Connecting…'); this.P = await this.makePeer(null); }
    catch (e) { this.say("Couldn't reach the matchmaking server. No internet? Use QR codes."); return false; }
    this.P.on('error', e => { if (e.type === 'peer-unavailable') this.say('No room with code ' + this.code); });
    const peer = { slot: 0, rtt: 0, link: '…', open: false, last: performance.now() };
    peer.fast = { readyState: 'closed', send() { } };
    this.peers.push(peer);
    this.say('Finding room ' + this.code + '…');
    const dst = this.roomId(this.code);
    this.wire(peer, this.P.connect(dst, { reliable: true, serialization: 'raw', metadata: { ch: 'rel' } }), 'rel');
    this.wire(peer, this.P.connect(dst, { reliable: false, serialization: 'raw', metadata: { ch: 'fast' } }), 'fast');
    setTimeout(() => { if (!peer.open && this.role === 'guest' && this.peers[0] === peer && !/No room|full/.test(this.status)) this.say('No answer from room ' + this.code + '. Check the code?'); }, 12000);
    return true;
  },

  // ---------- offline: QR handshake ----------
  async pack(sdp) { // compress the handshake so it fits a QR code comfortably
    const keep = sdp.split('\r\n').filter(l => l && !/^a=(extmap|rtcp-fb|ssrc|msid|rtpmap|fmtp)/.test(l)).join('\n');
    try {
      const s = new Blob([keep]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      const b = new Uint8Array(await new Response(s).arrayBuffer());
      let bin = ''; for (const x of b) bin += String.fromCharCode(x);
      return 'Z' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    } catch (e) { return 'R' + btoa(keep); }
  },
  async unpack(s) {
    if (s[0] === 'R') return atob(s.slice(1)).split('\n').join('\r\n') + '\r\n';
    const b64 = s.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64), b = Uint8Array.from(bin, c => c.charCodeAt(0));
    const out = new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return (await new Response(out).text()).split('\n').join('\r\n') + '\r\n';
  },
  // host side: one invite per guest
  async qrInvite() {
    if (this.role !== 'host') { this.reset(); this.role = 'host'; this.mySlot = 0; this.code = 'QR'; }
    const slot = this.freeSlot(); if (slot < 0) return null;
    const peer = this.newPeer(slot); this.peers.push(peer); this.pending = peer;
    peer.rel.addEventListener('open', () => this.send(peer, { t: 'welcome', slot }));
    return 'E1' + await this.pack(await this.offer(peer));
  },
  async qrAcceptReply(s) { const peer = this.pending; if (!peer || !s.startsWith('E2')) return false; await this.accept(peer, await this.unpack(s.slice(2))); this.pending = null; return true; },
  // guest side: scan the invite, show a reply
  async qrReply(s) {
    if (!s.startsWith('E1')) return null;
    this.reset(); this.role = 'guest'; this.code = 'QR';
    const peer = this.newPeer(0); this.peers.push(peer);
    return 'E2' + await this.pack(await this.answer(peer, await this.unpack(s.slice(2))));
  },
};

// ---- QR helpers: the encoder and camera decoder load only when someone needs them ----
const QR = {
  load(src, name) {
    if (window[name]) return Promise.resolve();
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });
  },
  async draw(canvas, text) {
    await this.load('vendor/qrcode.min.js', 'qrcode');
    const q = qrcode(0, 'L'); q.addData(text); q.make();
    const n = q.getModuleCount(), px = 6, sz = (n + 8) * px;
    canvas.width = canvas.height = sz; const c = canvas.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, sz, sz); c.fillStyle = '#000';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) c.fillRect((x + 4) * px, (y + 4) * px, px, px);
  },
  stream: null,
  async scan(video, onText) {
    await this.load('vendor/jsqr.min.js', 'jsQR');
    this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    video.srcObject = this.stream; video.setAttribute('playsinline', ''); video.muted = true; await video.play();
    const cv = document.createElement('canvas'), c = cv.getContext('2d', { willReadFrequently: true });
    const tick = () => {
      if (!this.stream) return;
      if (video.videoWidth) {
        const k = Math.min(1, 640 / video.videoWidth); cv.width = video.videoWidth * k; cv.height = video.videoHeight * k;
        c.drawImage(video, 0, 0, cv.width, cv.height);
        const r = jsQR(c.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
        if (r && r.data && /^E[12]/.test(r.data)) { this.stop(); onText(r.data); return; }
      }
      setTimeout(tick, 120);
    };
    tick();
  },
  stop() { if (this.stream) for (const t of this.stream.getTracks()) t.stop(); this.stream = null; },
};

// ===== Co-op connection test =====
// A bare arena: everyone gets a dot, the host moves them all, guests just send their stick.

    Menu.on('n-qjoin', () => { this.qrMode = true; this.qrJoin(); });

  },

  // ---------- QR flows ----------
  async qrInvite() {

  },
  qrJoin() { this.qrScan("Scan the host's invite code", async s => {

  qrScan(title, onText) {

  // ---------- the arena ----------
  arena() {
    Menu.html(`<canvas id="n-cv" style="position:fixed;inset:0;width:100vw;height:100vh;touch-action:none"></canvas>
      <div style="position:fixed;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:14px">
        <div id="n-info" style="text-align:left"></div>
        <div style="pointer-events:auto;display:flex;gap:8px">${Net.role === 'host' && this.qrMode ? '<button class="btn small" id="n-inv" style="width:auto;margin:0">Invite with QR</button>' : ''}<button class="btn small" id="n-leave" style="width:auto;margin:0">Leave</button></div>
      </div>`);
    Menu.on('n-leave', () => this.home());
    Menu.on('n-inv', () => this.qrInvite());
    this.cv = document.getElementById('n-cv'); this.c = this.cv.getContext('2d');
    if (!this.pos[0]) this.pos = {};
    if (Net.role === 'host' && !this.pos[0]) this.pos[0] = { x: this.AW / 2, y: this.AH / 2 };
    Net.onMsg = (peer, m) => this.onMsg(peer, m);
    Net.onChange = () => this.info();
    this.bindInput(); this.info();
    if (!this.run) { this.run = true; this.last = performance.now(); requestAnimationFrame(t => this.loop(t)); }
  },
  stop() { this.run = false; this.pos = {}; this.inp = {}; this.unbindInput(); },
  bindInput() {
    this.unbindInput();
    this.kd = e => { if (e.target.tagName === 'INPUT') return; this.keys.add(e.key.toLowerCase()); };
    this.ku = e => this.keys.delete(e.key.toLowerCase());
    addEventListener('keydown', this.kd); addEventListener('keyup', this.ku);
    const cv = this.cv, pt = e => ({ x: e.clientX, y: e.clientY });
    cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); this.touch = { id: e.pointerId, o: pt(e), p: pt(e) }; };
    cv.onpointermove = e => { if (this.touch && this.touch.id === e.pointerId) this.touch.p = pt(e); };
    cv.onpointerup = cv.onpointercancel = e => { if (this.touch && this.touch.id === e.pointerId) this.touch = null; };
  },
  unbindInput() { if (this.kd) { removeEventListener('keydown', this.kd); removeEventListener('keyup', this.ku); } this.keys.clear(); this.touch = null; },
  myStick() {
    const k = this.keys; let x = (k.has('d') || k.has('arrowright') ? 1 : 0) - (k.has('a') || k.has('arrowleft') ? 1 : 0), y = (k.has('s') || k.has('arrowdown') ? 1 : 0) - (k.has('w') || k.has('arrowup') ? 1 : 0);
    if (this.touch) { const dx = this.touch.p.x - this.touch.o.x, dy = this.touch.p.y - this.touch.o.y, d = Math.hypot(dx, dy); if (d > 6) { x = dx / Math.max(d, 50); y = dy / Math.max(d, 50); } }
    const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(g => g) : null;
    if (gp && Math.hypot(gp.axes[0], gp.axes[1]) > 0.2) { x = gp.axes[0]; y = gp.axes[1]; }
    const m = Math.hypot(x, y); return m > 1 ? [x / m, y / m] : [x, y];
  },
  onMsg(peer, m) {
    if (Net.role === 'host') {
      if (m.t === 'in') this.inp[peer.slot] = [clamp(+m.x || 0, -1, 1), clamp(+m.y || 0, -1, 1)];
    } else if (m.t === 'st') {
      for (const [s, x, y] of m.p) { const o = this.pos[s] || (this.pos[s] = { x, y, tx: x, ty: y }); o.tx = x; o.ty = y; }
      for (const s of Object.keys(this.pos)) if (!m.p.some(q => q[0] === +s)) delete this.pos[s];
      this.hostRtt = m.r;
    }
  },
  loop(t) {
    if (!this.run) return;
    const dt = Math.min(0.05, (t - this.last) / 1000); this.last = t;
    const host = Net.role === 'host', [mx, my] = this.myStick();
    this.pingT -= dt; if (this.pingT <= 0) { this.pingT = 1; Net.pingAll(); this.info(); }
    if (host) {
      this.inp[0] = [mx, my];
      for (const p of Net.peers) if (p.open && !this.pos[p.slot]) this.pos[p.slot] = { x: this.AW / 2 + (p.slot === 1 ? -80 : 80), y: this.AH / 2 };
      for (const s of Object.keys(this.pos)) if (+s !== 0 && !Net.peers.some(p => p.slot === +s && p.open)) delete this.pos[s];
      for (const s of Object.keys(this.pos)) { const o = this.pos[s], i = this.inp[s] || [0, 0]; o.x = clamp(o.x + i[0] * 260 * dt, 20, this.AW - 20); o.y = clamp(o.y + i[1] * 260 * dt, 20, this.AH - 20); }
      this.stT -= dt; if (this.stT <= 0) { this.stT = 0.05; Net.broadcast({ t: 'st', p: Object.keys(this.pos).map(s => [+s, Math.round(this.pos[s].x), Math.round(this.pos[s].y)]), r: Net.peers.map(p => [p.slot, Math.round(p.rtt)]) }, true); }
    } else {
      this.sendT -= dt; if (this.sendT <= 0 && Net.peers[0]) { this.sendT = 1 / 30; Net.send(Net.peers[0], { t: 'in', x: +mx.toFixed(2), y: +my.toFixed(2) }, true); }
      for (const o of Object.values(this.pos)) { o.x = lerp(o.x, o.tx, 1 - Math.exp(-dt * 18)); o.y = lerp(o.y, o.ty, 1 - Math.exp(-dt * 18)); }
    }
    this.draw();
    requestAnimationFrame(t2 => this.loop(t2));
  },
  draw() {
    const cv = this.cv; if (!cv || !cv.isConnected) { this.run = false; return; }
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const c = this.c, k = Math.min((W - 30) / this.AW, (H - 110) / this.AH), ox = (W - this.AW * k) / 2, oy = 70 + (H - 80 - this.AH * k) / 2;
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = '#07050d'; c.fillRect(0, 0, W, H);
    c.save(); c.translate(ox, oy); c.scale(k, k);
    c.fillStyle = '#120c24'; c.fillRect(0, 0, this.AW, this.AH);
    c.strokeStyle = 'rgba(120,100,200,0.15)'; c.lineWidth = 1; for (let x = 0; x <= this.AW; x += 50) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, this.AH); c.stroke(); } for (let y = 0; y <= this.AH; y += 50) { c.beginPath(); c.moveTo(0, y); c.lineTo(this.AW, y); c.stroke(); }
    c.strokeStyle = '#5b47a0'; c.lineWidth = 3; c.strokeRect(0, 0, this.AW, this.AH);
    const me = Net.role === 'host' ? 0 : Net.mySlot;
    for (const s of Object.keys(this.pos)) {
      const o = this.pos[s], col = this.COL[s] || '#fff';
      c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 18; c.beginPath(); c.arc(o.x, o.y, 18, 0, TAU); c.fill(); c.shadowBlur = 0;
      if (+s === me) { c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke(); }
      c.fillStyle = '#fff'; c.font = '700 15px system-ui'; c.textAlign = 'center'; c.fillText('P' + (+s + 1) + (+s === 0 ? ' host' : '') + (+s === me ? ' (you)' : ''), o.x, o.y - 26);
    }
    c.restore();
    if (Net.role === 'guest' && !(Net.peers[0] && Net.peers[0].open)) { c.fillStyle = '#e8dcff'; c.font = '700 18px system-ui'; c.textAlign = 'center'; c.fillText(Net.status || 'Connecting…', W / 2, H / 2); }
  },
  info() {
    const el = document.getElementById('n-info'); if (!el) return;
    const rows = [];
    if (Net.role === 'host') {
      rows.push(Net.code && Net.code !== 'QR' ? `Room <b style="font-size:22px;letter-spacing:.12em;color:#ffb057">${Net.code}</b> · ${1 + Net.peers.filter(p => p.open).length}/3 players` : `QR room · ${1 + Net.peers.filter(p => p.open).length}/3 players`);
      for (const p of Net.peers) rows.push(`<span style="color:${this.COL[p.slot]}">P${p.slot + 1}</span> ${p.open ? `${Math.round(p.rtt)} ms · ${p.link}` : 'connecting…'}`);
      if (!Net.peers.length) rows.push(this.qrMode ? 'Tap "Invite with QR" for each player.' : 'Others: Co-op Test → type this code → Join');
    } else {
      const p = Net.peers[0];
      rows.push(p && p.open ? `In room ${Net.code !== 'QR' ? Net.code : '(QR)'} as <span style="color:${this.COL[Net.mySlot]}">P${(Net.mySlot || 0) + 1}</span>` : Net.status);
      if (p && p.open) rows.push(`${Math.round(p.rtt)} ms to host · ${p.link}`);
    }
    rows.push('<span style="opacity:.6">Move: WASD, arrows, stick, or drag anywhere</span>');
    el.innerHTML = rows.map(r => `<div style="margin:2px 0;text-shadow:0 1px 3px #000">${r}</div>`).join('');
  },
};

// ===== Co-op =====
// The host runs the real game. Guests send their controls and draw what the host sends back.
// Maps come from the seed, so only the moving parts travel: players, foes, shots, loot, hazards.
const Coop = {
  on: false, host: false, slot: 0, inRun: false,
  lobby: [],          // [{ slot, cls, unl }]
  pending: [],        // players who joined mid-run, added at the next level
  inputs: {},         // host: latest controls per guest slot
  seen: {},           // host: press counters already used, per slot
  ev: [], sendT: 0, tileT: 0, lastMap: null, lastThp: '',
  cnt: { roll: 0, swap: 0, use: 0, bag: 0, potion: 0, relic: 0 }, inT: 0,
  ents: new Map(),    // guest: replicated foes by id
  pausedBy: '',

  // ---------- connecting ----------
  home() {
    this.reset();
    NetTest.onDone = () => this.lobbyScreen();
    Menu.html(`<h2>Co-op</h2><div class="sub">Up to 3 players, each on their own device, on the same WiFi. One device hosts. A PC or iPad makes the steadiest host.</div>
      <button class="btn" id="c-host">Host a game</button>

      <div class="sub" style="margin-top:14px">No internet? Join the same WiFi and pass QR codes between screens.</div>
      <div class="row"><button class="btn small" id="c-qhost">Host with QR</button><button class="btn small" id="c-qjoin">Join with QR</button></div>
      <div class="sub" id="c-msg" style="min-height:1.2em;color:#ff8a9a"></div>

    const msg = t => { const el = document.getElementById('c-msg'); if (el) el.textContent = t; };
    Menu.on('c-host', async () => { msg(''); this.startHosting(); if (await Net.host()) this.lobbyScreen(); else { msg(Net.status); this.reset(); } });

    Menu.on('c-join', join);
    document.getElementById('c-code').onkeydown = e => { if (e.key === 'Enter') join(); };

    Menu.on('c-qjoin', () => { NetTest.qrMode = true; this.startGuest(); NetTest.qrJoin(); });
    Menu.on('c-test', () => { NetTest.onDone = null; NetTest.home(); });
    Menu.on('b-back', () => { this.reset(); Menu.show('title'); });
  },
  reset() {
    Net.reset(); NetTest.stop();
    this.on = false; this.host = false; this.slot = 0; this.inRun = false; this.lobby = []; this.pending = []; this.inputs = {}; this.seen = {};
    this.ents = new Map(); this.ev = []; Game.coopN = 1; Meta.over = null;
  },

    Net.onChange = () => this.hostPeersChanged();
  },

  },
  myUnl() { return Object.assign({}, Meta.data.unlocks); },
  classOk(cls, unl) { return !!CLASSES[cls]; }, // every class is open in co-op, so nobody gets locked out by the no-repeats rule

  // ---------- lobby ----------
  lobbyScreen() {
    if (!this.on) return this.home();

  const tp = Game.togglePause.bind(Game);
  Game.togglePause = function () {
    if (Coop.on && !Coop.host && Coop.inRun) { if (Net.peers[0]) Net.send(Net.peers[0], { t: Game.state === 'play' ? 'pause' : 'resume' }); return; }
    if (Coop.on && Coop.host && Game.state === 'play' && !Coop.pausedBy) Coop.pausedBy = 'P1';
    tp();
    if (Game.state === 'play') Coop.pausedBy = '';
  };
})();

// ===== Boot =====
Dev.init(); Meta.load();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
Render.init();
Input.init(Render.cv);
Menu.el = document.getElementById('menu');
Menu.el.addEventListener('pointerdown', () => Snd.init());
Menu.show('title');
requestAnimationFrame(t => Game.frame(t));
window.__emberdeep = { Game, World, Meta, Render };

</script>
</body>
