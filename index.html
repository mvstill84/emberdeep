<style>

<body>
<canvas id="c"></canvas>
<div id="menu"></div>
<script>
'use strict';
// ===== Core: math, seeded randomness, storage =====
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const d2 = (ax, ay, bx, by) => { const x = bx - ax, y = by - ay; return x * x + y * y; };
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };

// One hash to rule them all: (seed, a, b, salt) -> uint32. Same inputs, same answer, forever.
function hash(a, b = 0, c = 0, d = 0) {
  let h = (a | 0) ^ 0x9E3779B9;
  h = Math.imul(h ^ (b | 0), 0x85EBCA6B); h ^= h >>> 13;
  h = Math.imul(h ^ (c | 0), 0xC2B2AE35); h ^= h >>> 16;
  h = Math.imul(h ^ (d | 0), 0x27D4EB2F); h ^= h >>> 15;
  return h >>> 0;
}
function strHash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

// Small fast PRNG (mulberry32) with helpers
function RNG(seed) {
  let t = seed >>> 0;
  const f = () => {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
  f.int = (a, b) => a + Math.floor(f() * (b - a + 1));
  f.range = (a, b) => a + f() * (b - a);
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.chance = p => f() < p;
  f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  f.weighted = (list, wf) => { let tot = 0; for (const x of list) tot += wf(x); let r = f() * tot; for (const x of list) { r -= wf(x); if (r <= 0) return x; } return list[list.length - 1]; };
  return f;
}
const R = RNG((Math.random() * 4294967296) >>> 0); // unseeded combat randomness

const SEED_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normSeed = s => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
const randomSeed = () => { let s = ''; for (let i = 0; i < 6; i++) s += SEED_CHARS[Math.floor(Math.random() * SEED_CHARS.length)]; return s; };

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

// ===== Persistent meta (embers, unlocks, saved seeds, secrets) =====
const SAVE_KEY = 'emberdeep.v1';
const Meta = {
  data: { embers: 0, unlocks: {}, seeds: [], secrets: {}, stats: { runs: 0, wins: 0, bestFloor: 0, kills: 0 }, muted: false },
  load() {
    try { const s = localStorage.getItem(SAVE_KEY); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) { }
    this.data.stats = Object.assign({ runs: 0, wins: 0, bestFloor: 0, kills: 0 }, this.data.stats);
  },
  save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { } },
  has(id) { return !!this.data.unlocks[id]; },
};

// ===== Input: keyboard/mouse, touch twin-sticks, gamepads, read through "slots" =====
const Input = {
  keys: new Set(), pressed: new Set(),
  mouse: { x: 0, y: 0, l: false, r: false, rPressed: false },
  last: 'kb', // 'kb' | 'touch' | 'pad'
  sticks: { L: null, R: null }, // touch sticks {id, ox, oy, x, y}
  tbtn: { roll: false, swap: false, use: false }, // touch button presses this frame
  padPrev: [],
  init(canvas) {
    addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (!this.keys.has(k)) this.pressed.add(k);
      this.keys.add(k); this.last = 'kb';
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab'].includes(k)) e.preventDefault();
    });
    addEventListener('keyup', e => this.keys.delete(e.key.toLowerCase()));
    addEventListener('blur', () => { this.keys.clear(); this.mouse.l = this.mouse.r = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('pointerdown', e => {
      Snd.init();
      if (e.pointerType === 'touch') { this.touchDown(e); return; }
      this.last = 'kb';
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      if (e.button === 0) this.mouse.l = true;
      if (e.button === 2) { this.mouse.r = true; this.mouse.rPressed = true; }
    });
    addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') { this.touchMove(e); return; }
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
    });
    const up = e => {
      if (e.pointerType === 'touch') { this.touchUp(e); return; }
      if (e.button === 0) this.mouse.l = false;
      if (e.button === 2) this.mouse.r = false;
    };
    addEventListener('pointerup', up); addEventListener('pointercancel', up);
  },
  // Touch layout: buttons bottom-right, left half = move stick, right half = aim/attack stick
  touchButtons() {
    const w = innerWidth, h = innerHeight, s = Math.min(w, h);
    const r = s * 0.07;
    return [
      { id: 'roll', x: w - r * 1.6, y: h - r * 4.1, r },
      { id: 'swap', x: w - r * 3.9, y: h - r * 4.7, r: r * 0.8 },
      { id: 'use', x: w - r * 1.4, y: h - r * 6.6, r: r * 0.8 },
      { id: 'pause', x: w - r * 0.9, y: r * 0.9 + 6, r: r * 0.6 },
    ];
  },
  touchDown(e) {
    this.last = 'touch';
    const x = e.clientX, y = e.clientY;
    for (const b of this.touchButtons()) {
      if (d2(x, y, b.x, b.y) < (b.r * 1.15) ** 2) {
        if (b.id === 'pause') Game.togglePause(); else this.tbtn[b.id] = true;
        return;
      }
    }
    const side = x < innerWidth * 0.5 ? 'L' : 'R';
    if (!this.sticks[side]) this.sticks[side] = { id: e.pointerId, ox: x, oy: y, x, y };
  },
  touchMove(e) {
    for (const s of ['L', 'R']) { const st = this.sticks[s]; if (st && st.id === e.pointerId) { st.x = e.clientX; st.y = e.clientY; } }
  },
  touchUp(e) {
    for (const s of ['L', 'R']) { const st = this.sticks[s]; if (st && st.id === e.pointerId) this.sticks[s] = null; }
  },
  stickVec(st, max) {
    if (!st) return { x: 0, y: 0, m: 0 };
    let dx = st.x - st.ox, dy = st.y - st.oy; const l = Math.hypot(dx, dy);
    if (l > max) { st.ox = st.x - dx / l * max; st.oy = st.y - dy / l * max; dx = dx / l * max; dy = dy / l * max; }
    const m = Math.min(1, l / max);
    return { x: l ? dx / l * m : 0, y: l ? dy / l * m : 0, m };
  },
  pads() { return navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; },
  // Read one player's controls. src: 'auto' follows the last-used device (solo); 'pad0'.. for co-op later.
  read(src, player) {
    const out = { mx: 0, my: 0, aim: null, attack: false, roll: false, swap: false, use: false, device: 'kb' };
    let dev = src;
    if (src === 'auto') {
      const p = this.pads()[0];
      if (p && (p.buttons.some(b => b.pressed) || p.axes.some(a => Math.abs(a) > 0.4))) this.last = 'pad';
      dev = this.last === 'pad' ? 'pad0' : this.last;
    }
    out.device = dev.startsWith('pad') ? 'pad' : dev;
    if (dev === 'kb') {
      const k = this.keys;
      out.mx = (k.has('d') || k.has('arrowright') ? 1 : 0) - (k.has('a') || k.has('arrowleft') ? 1 : 0);
      out.my = (k.has('s') || k.has('arrowdown') ? 1 : 0) - (k.has('w') || k.has('arrowup') ? 1 : 0);
      const l = Math.hypot(out.mx, out.my); if (l > 1) { out.mx /= l; out.my /= l; }
      const wp = Render.screenToWorld(this.mouse.x, this.mouse.y);
      out.aim = Math.atan2(wp.y - player.y, wp.x - player.x);
      out.attack = this.mouse.l;
      out.roll = this.pressed.has(' ') || this.pressed.has('shift') || this.mouse.rPressed;
      out.swap = this.pressed.has('q') || this.pressed.has('tab');
      out.use = this.pressed.has('e') || this.pressed.has('f');
    } else if (dev === 'touch') {
      const max = Math.min(innerWidth, innerHeight) * 0.09;
      const L = this.stickVec(this.sticks.L, max), Rv = this.stickVec(this.sticks.R, max);
      out.mx = L.x; out.my = L.y;
      if (Rv.m > 0.25) { out.aim = Math.atan2(Rv.y, Rv.x); out.attack = true; out.assist = true; }
      out.roll = this.tbtn.roll; out.swap = this.tbtn.swap; out.use = this.tbtn.use;
    } else {
      const p = this.pads()[+dev.slice(3)] || null;
      if (p) {
        const dz = v => Math.abs(v) < 0.18 ? 0 : v;
        out.mx = dz(p.axes[0]); out.my = dz(p.axes[1]);
        const ax = dz(p.axes[2]), ay = dz(p.axes[3]);
        if (Math.hypot(ax, ay) > 0.3) out.aim = Math.atan2(ay, ax), out.assist = true;
        const btn = i => p.buttons[i] && p.buttons[i].pressed;
        const prev = this.padPrev[p.index] || [];
        const tap = i => btn(i) && !prev[i];
        out.attack = btn(7) || btn(5) || (out.aim !== null && Math.hypot(ax, ay) > 0.6);
        out.roll = tap(0) || tap(4) || tap(6);
        out.swap = tap(3); out.use = tap(2);
        if (tap(9)) Game.togglePause();
      }
    }
    return out;
  },
  endFrame() {
    this.pressed.clear(); this.mouse.rPressed = false;
    this.tbtn.roll = this.tbtn.swap = this.tbtn.use = false;
    for (const p of this.pads()) this.padPrev[p.index] = p.buttons.map(b => b.pressed);
  },
};

// ===== Audio: everything synthesized, no sound files =====
const Snd = {
  ctx: null, master: null, sfxBus: null, musBus: null, noiseBuf: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = Meta.data.muted ? 0 : 0.8; this.master.connect(c.destination);
    this.sfxBus = c.createGain(); this.sfxBus.gain.value = 0.55; this.sfxBus.connect(this.master);
    this.musBus = c.createGain(); this.musBus.gain.value = 0.32; this.musBus.connect(this.master);
    const n = c.sampleRate; this.noiseBuf = c.createBuffer(1, n, n);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    Music.boot();
  },
  setMuted(m) { Meta.data.muted = m; Meta.save(); if (this.master) this.master.gain.value = m ? 0 : 0.8; },
  tone(f, dur, type = 'square', vol = 0.2, slide = 0, delay = 0, bus) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.2, freq = 2000, q = 1, delay = 0, sweep = 0, bus) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * sweep), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || this.sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  last: {},
  play(name) {
    if (!this.ctx) return;
    const now = performance.now(); if (now - (this.last[name] || 0) < 35) return; this.last[name] = now;
    const r = 1 + (Math.random() - 0.5) * 0.12;
    switch (name) {
      case 'swing': this.noise(0.13, 0.22, 1800 * r, 2, 0, 2.6); break;
      case 'arrow': this.noise(0.09, 0.16, 3000 * r, 3, 0, 0.5); this.tone(700 * r, 0.06, 'triangle', 0.06, 0.5); break;
      case 'charge': this.tone(330, 0.12, 'sine', 0.06, 2); break;
      case 'bolt': this.tone(880 * r, 0.08, 'square', 0.05, 0.5); break;
      case 'hit': this.noise(0.07, 0.2, 900 * r, 1.5); this.tone(180 * r, 0.06, 'square', 0.06, 0.6); break;
      case 'deflect': this.tone(1400 * r, 0.09, 'triangle', 0.1, 1.4); break;
      case 'kill': this.noise(0.22, 0.22, 500 * r, 1, 0, 0.3); this.tone(220 * r, 0.18, 'sawtooth', 0.07, 0.3); break;
      case 'hurt': this.tone(300, 0.3, 'sawtooth', 0.18, 0.3); this.noise(0.2, 0.25, 400, 1); break;
      case 'roll': this.noise(0.16, 0.1, 700, 1, 0, 2); break;
      case 'eshot': this.tone(520 * r, 0.07, 'sine', 0.04, 0.7); break;
      case 'ember': this.tone(1100 * r, 0.05, 'sine', 0.05, 1.3); break;
      case 'heart': [523, 659, 784].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.1, 1, i * 0.06)); break;
      case 'item': [392, 523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.1, 1, i * 0.07)); break;
      case 'synergy': [523, 784, 1046, 1568].forEach((f, i) => { this.tone(f, 0.4, 'sine', 0.1, 1, i * 0.09); this.tone(f * 1.5, 0.3, 'triangle', 0.04, 1, i * 0.09 + 0.04); }); break;
      case 'door': this.tone(90, 0.3, 'square', 0.12, 0.6); this.noise(0.25, 0.15, 200, 1); break;
      case 'clear': [659, 784, 988].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.08, 1, i * 0.08)); break;
      case 'explode': this.noise(0.45, 0.35, 300, 0.7, 0, 0.25); this.tone(80, 0.4, 'sawtooth', 0.12, 0.4); break;
      case 'zap': this.noise(0.1, 0.18, 4000, 4, 0, 0.4); this.tone(1600 * r, 0.06, 'sawtooth', 0.05, 0.4); break;
      case 'spawn': this.tone(200 * r, 0.3, 'sine', 0.06, 2.2); break;
      case 'boss': this.tone(55, 1.2, 'sawtooth', 0.2, 0.8); this.noise(1, 0.2, 150, 1); break;
      case 'portal': [262, 330, 392, 523, 659].forEach((f, i) => this.tone(f, 0.5, 'sine', 0.08, 1.01, i * 0.05)); break;
      case 'death': [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.4, 'triangle', 0.12, 0.9, i * 0.18)); break;
      case 'ui': this.tone(660, 0.05, 'triangle', 0.06); break;
    }
  },
};

// Seeded generative music: a minor-key loop that thickens when a fight starts
const Music = {
  on: false, step: 0, next: 0, intensity: 0, target: 0, seed: 1, timer: null,
  boot() { if (this.timer) return; this.timer = setInterval(() => this.tick(), 30); },
  setSeed(s) {
    this.seed = s; const rng = RNG(hash(s, 777));
    const roots = [110, 116.54, 123.47, 130.81, 98, 103.83];
    this.root = rng.pick(roots);
    const scales = [[0, 3, 5, 7, 10], [0, 2, 3, 7, 8], [0, 3, 5, 6, 7, 10]];
    this.scale = rng.pick(scales);
    this.arp = Array.from({ length: 16 }, () => rng.chance(0.75) ? rng.int(0, this.scale.length * 2 - 1) : -1);
    this.bass = Array.from({ length: 16 }, (_, i) => i % 4 === 0 ? rng.pick([0, 0, 3, 4, -2]) : (rng.chance(0.2) ? rng.pick([0, 2]) : null));
    this.prog = [0, rng.pick([3, 5, 8]), rng.pick([5, 7, 10]), rng.pick([3, 7])];
  },
  note(deg, oct = 0) {
    const n = this.scale.length, o = Math.floor(deg / n) + oct, i = ((deg % n) + n) % n;
    return this.root * Math.pow(2, o + this.scale[i] / 12);
  },
  tick() {
    const c = Snd.ctx; if (!c || !this.on || !this.scale) return;
    this.intensity = lerp(this.intensity, this.target, 0.02);
    const spb = 60 / 104 / 4;
    if (this.next < c.currentTime) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.12) {
      const s = this.step % 16, bar = Math.floor(this.step / 16) % 4, t = this.next - c.currentTime;
      const shift = Math.pow(2, this.prog[bar] / 12);
      const b = this.bass[s];
      if (b !== null) this.voice(this.note(b, -1) * shift, spb * 3.5, 'triangle', 0.22, t);
      if (s === 0) this.voice(this.note(0, 0) * shift, spb * 15, 'sine', 0.05, t), this.voice(this.note(2, 0) * shift, spb * 15, 'sine', 0.035, t);
      const a = this.arp[s];
      if (a >= 0 && (this.intensity > 0.3 || s % 2 === 0)) this.voice(this.note(a, 1) * shift, spb * 1.6, 'square', 0.025 + 0.02 * this.intensity, t);
      if (this.intensity > 0.4) {
        if (s % 4 === 0) Snd.noise(0.12, 0.18 * this.intensity, 120, 1, t, 0.5, Snd.musBus);
        if (s % 4 === 2) Snd.noise(0.05, 0.08 * this.intensity, 7000, 1, t, 1, Snd.musBus);
        if (s === 4 || s === 12) Snd.noise(0.12, 0.12 * this.intensity, 1500, 0.8, t, 0.6, Snd.musBus);
      }
      this.step++; this.next += spb;
    }
  },
  voice(f, dur, type, vol, delay) { Snd.tone(f, dur, type, vol, 0, delay, Snd.musBus); },
};

// ===== Data: elements, weapons, items, synergies, enemies, unlocks, secret seeds =====
const ELEM = {
  none: { c: '#dfe9ff', n: '' },

function properName(rng, n = 2) {
  let s = ''; for (let i = 0; i < n; i++) s += rng.pick(SYL);
  if (rng.chance(0.3)) s = s.slice(0, 2) + "'" + s.slice(2);
  return s[0].toUpperCase() + s.slice(1);
}

// Build a weapon from a seed. Everything about it comes out of the rng.
function makeWeapon(rng, opts = {}) {
  const type = opts.type || rng.pick(opts.types || ['sword', 'bow', 'staff']);
  const B = WBASE[type];
  let rar = opts.rarity;
  if (rar === undefined) {
    const luck = Meta.has('luck') ? 1.5 : 1, f = opts.floor || 1;
    const roll = rng();
    rar = roll < 0.035 * luck * f ? 3 : roll < 0.14 * luck * f ? 2 : roll < 0.42 * luck ? 1 : 0;
  }
  if (Game.mods.allLegendary) rar = 3;
  const R0 = RARITY[rar];
  const w = {
    type, rarity: rar,
    dmg: rng.range(...B.dmg) * R0.m,
    cd: rng.range(...B.cd),
    elem: opts.elem || (rar === 0 && rng.chance(0.6) ? 'none' : rng.pick(['none', 'fire', 'frost', 'storm', 'arcane'])),
    quirks: [],
  };
  if (type === 'sword') { w.reach = rng.range(...B.reach); w.arc = rng.range(...B.arc) * Math.PI / 180; }
  if (type === 'bow') { w.charge = rng.range(...B.charge); w.speed = rng.range(...B.speed); }
  if (type === 'staff') { w.speed = rng.range(...B.speed); w.spread = rng.range(...B.spread); }
  const nq = rar >= 3 ? 2 : rar >= 1 ? 1 : (rng.chance(0.25) ? 1 : 0);
  const pool = QUIRKS.filter(q => q.t.includes(type));
  rng.shuffle(pool);
  for (let i = 0; i < nq; i++) w.quirks.push(pool[i].id);
  if (w.quirks.includes('heavy')) { w.dmg *= 1.5; w.cd *= 1.35; }
  if (w.quirks.includes('swift')) w.cd /= 1.3;
  const base = rng.pick(B.names), el = ELEM[w.elem].n;
  if (opts.name) w.name = opts.name;
  else if (rar === 3) w.name = `${properName(rng)}, ${el ? el + ' ' : ''}${base}`;
  else {
    const q = w.quirks[0] ? QUIRKS.find(x => x.id === w.quirks[0]) : null;
    w.name = `${el ? el + ' ' : ''}${base}${q ? ' ' + q.suf : ''}`;
  }
  return w;
}
const hasQ = (w, id) => w.quirks.includes(id);

// ===== World: floor generation, entities, combat =====
const T = 32, CW = 24, CH = 18, GRID = 6, MW = CW * GRID, MH = CH * GRID;
const VOID = 0, FLOOR = 1, WALL = 2, PILLAR = 3, DOOR = 4, SHUT = 5;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const solidT = t => t === VOID || t === WALL || t === PILLAR || t === SHUT;

const World = {
  floor: 1, map: null, rooms: [], room: null, locked: false, waves: [], waveT: 0,
  players: [], enemies: [], projs: [], parts: [], pickups: [], bolts: [], texts: [],
  flow: null, flowStamp: 0, flowKey: -1, flowT: 0, boss: null, time: 0,

  // ---------- generation ----------
  gen(f) {
    this.floor = f;
    const rng = RNG(hash(Game.seedNum, f, 101));
    const map = this.map = new Uint8Array(MW * MH);
    const cells = new Map(), key = (x, y) => x + y * GRID;
    const rooms = this.rooms = [];
    const add = (cx, cy) => { const r = { id: rooms.length, cx, cy, links: [], type: 'combat', cleared: false, visited: false, known: false, doors: [] }; rooms.push(r); cells.set(key(cx, cy), r); return r; };
    const link = (a, b) => { a.links.push(b.id); b.links.push(a.id); };
    const start = add(rng.int(1, GRID - 2), rng.int(1, GRID - 2)); start.type = 'start';
    const target = Math.min(8 + f * 2, 15);
    for (let tries = 0; rooms.length < target && tries < 3000; tries++) {
      const r = rng.chance(0.55) ? rooms[Math.max(0, rooms.length - 1 - rng.int(0, 2))] : rng.pick(rooms);
      const [dx, dy] = rng.pick(DIRS), nx = r.cx + dx, ny = r.cy + dy;
      if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID || cells.has(key(nx, ny))) continue;
      let nb = 0; for (const [ex, ey] of DIRS) if (cells.has(key(nx + ex, ny + ey))) nb++;
      if (nb > 1 && rng.chance(0.75)) continue;
      link(r, add(nx, ny));
    }
    // distances from start (tree, so farthest room is always a dead end)
    const dist = new Map([[0, 0]]), q = [0];
    while (q.length) { const id = q.shift(); for (const n of rooms[id].links) if (!dist.has(n)) { dist.set(n, dist.get(id) + 1); q.push(n); } }
    rooms.forEach(r => r.dist = dist.get(r.id));
    const ends = rooms.filter(r => r.links.length === 1 && r.type !== 'start').sort((a, b) => b.dist - a.dist);
    const boss = ends[0] || rooms[rooms.length - 1]; boss.type = 'boss';
    const t1 = ends[1] || rng.pick(rooms.filter(r => r.type === 'combat')); if (t1) t1.type = 'treasure';
    if (f >= 2 && ends[2]) ends[2].type = 'treasure';
    // a few loops so it's not a pure tree
    for (const r of rooms) for (const [dx, dy] of DIRS) {
      const n = cells.get(key(r.cx + dx, r.cy + dy));
      if (n && n.id > r.id && !r.links.includes(n.id) && r.type !== 'boss' && n.type !== 'boss' && rng.chance(0.15)) link(r, n);
    }
    // room sizes + carve
    for (const r of rooms) {
      if (r.type === 'boss') { r.w = 21; r.h = 15; }
      else if (r.type === 'start' || r.type === 'treasure') { r.w = 11; r.h = 9; }
      else { r.w = rng.pick([13, 15, 17, 19]); r.h = rng.pick([9, 11, 13]); }
      r.x = r.cx * CW + Math.floor((CW - r.w) / 2); r.y = r.cy * CH + Math.floor((CH - r.h) / 2);
      r.mx = r.x + (r.w - 1) / 2; r.my = r.y + (r.h - 1) / 2;
      for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) map[y * MW + x] = FLOOR;
    }
    // corridors and doors
    for (const a of rooms) for (const bid of a.links) {
      const b = rooms[bid]; if (b.id < a.id) continue;
      if (a.cy === b.cy) {
        const L = a.cx < b.cx ? a : b, Rr = L === a ? b : a, y0 = L.my;
        for (let x = L.x + L.w; x <= Rr.x - 1; x++) for (let y = y0 - 1; y <= y0 + 1; y++) map[y * MW + x] = FLOOR;
        for (let y = y0 - 1; y <= y0 + 1; y++) { const i1 = y * MW + L.x + L.w, i2 = y * MW + Rr.x - 1; map[i1] = map[i2] = DOOR; L.doors.push(i1); Rr.doors.push(i2); }
      } else {
        const U = a.cy < b.cy ? a : b, D = U === a ? b : a, x0 = U.mx;
        for (let y = U.y + U.h; y <= D.y - 1; y++) for (let x = x0 - 1; x <= x0 + 1; x++) map[y * MW + x] = FLOOR;
        for (let x = x0 - 1; x <= x0 + 1; x++) { const i1 = (U.y + U.h) * MW + x, i2 = (D.y - 1) * MW + x; map[i1] = map[i2] = DOOR; U.doors.push(i1); D.doors.push(i2); }
      }
    }
    // walls hug every walkable tile
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      if (map[y * MW + x] !== VOID) continue;
      let near = false;
      for (let oy = -1; oy <= 1 && !near; oy++) for (let ox = -1; ox <= 1; ox++) {
        const xx = x + ox, yy = y + oy;
        if (xx >= 0 && yy >= 0 && xx < MW && yy < MH) { const t = map[yy * MW + xx]; if (t === FLOOR || t === DOOR) { near = true; break; } }
      }
      if (near) map[y * MW + x] = WALL;
    }
    // obstacles + seeded encounters
    for (const r of rooms) {
      const rr = RNG(hash(Game.seedNum, f, r.id, 7));
      if (r.type === 'combat') this.obstacles(r, rr, rr.pick(['none', 'pillars', 'center', 'scatter', 'lanes', 'pillars', 'scatter', 'ring']));
      if (r.type === 'boss') this.obstacles(r, rr, 'boss');
      if (r.type === 'combat') this.planWaves(r, rr, f);
      r.deco = [];
      for (let i = 0; i < r.w * r.h / 14; i++) r.deco.push({ x: r.x + rr.int(0, r.w - 1), y: r.y + rr.int(0, r.h - 1), k: rr.int(0, 3), a: rr() * TAU });
    }
    this.flow = new Int16Array(MW * MH);
    this.decoCache = null;
  },
  obstacles(r, rng, kind) {
    const x0 = r.x + 2, x1 = r.x + r.w - 3, y0 = r.y + 2, y1 = r.y + r.h - 3;
    const put = (x, y) => { if (x >= x0 && x <= x1 && y >= y0 && y <= y1) this.map[y * MW + x] = PILLAR; };
    const put4 = (dx, dy) => { put(r.mx + dx, r.my + dy); put(r.mx - dx, r.my + dy); put(r.mx + dx, r.my - dy); put(r.mx - dx, r.my - dy); };
    const hw = (r.w - 1) / 2, hh = (r.h - 1) / 2;
    if (kind === 'pillars' || kind === 'boss') {
      const dx = kind === 'boss' ? 6 : Math.max(2, Math.floor(r.w / 4)), dy = kind === 'boss' ? 4 : Math.max(2, Math.floor(r.h / 4));
      put4(dx, dy); put4(dx - 1, dy); put4(dx, dy - 1); put4(dx - 1, dy - 1);
    } else if (kind === 'center') {
      const ex = Math.floor(r.w / 7), ey = Math.floor(r.h / 7);
      for (let dx = 0; dx <= ex; dx++) for (let dy = 0; dy <= ey; dy++) put4(dx, dy);
    } else if (kind === 'scatter') {
      const n = rng.int(2, 4);
      for (let i = 0; i < n; i++) put4(rng.int(1, hw - 2), rng.int(1, hh - 2));
    } else if (kind === 'lanes') {
      const dy = Math.max(2, Math.floor(hh / 2)), len = Math.floor(hw / 2);
      for (let dx = 0; dx <= len; dx++) put4(dx, dy);
    } else if (kind === 'ring') {
      const dx = Math.max(2, Math.floor(hw / 2)), dy = Math.max(2, Math.floor(hh / 2));
      for (let i = 0; i <= dx; i++) if (i !== 0) put4(i, dy);
      for (let j = 0; j <= dy; j++) if (j !== 0 && j !== 1) put4(dx, j);
    }
  },
  planWaves(r, rng, f) {
    const pool = FLOOR_POOL[f];
    let budget = 4 + f * 2 + rng.int(0, 3) + (r.w * r.h > 200 ? 2 : 0);
    const nW = budget >= 8 ? 2 : 1, free = [];
    for (let y = r.y + 1; y < r.y + r.h - 1; y++) for (let x = r.x + 1; x < r.x + r.w - 1; x++) if (this.map[y * MW + x] === FLOOR) free.push([x, y]);
    r.waves = [];
    for (let w = 0; w < nW; w++) {
      let b = Math.ceil(budget / (nW - w)); budget -= b;
      const wave = [];
      for (let guard = 0; b > 0 && guard < 40; guard++) {
        const type = rng.pick(pool), c = EDEF[type].cost;
        if (c > b && b < 3) { wave.push({ type: 'slime', ...this.tilePos(rng.pick(free)) }); b--; continue; }
        if (c > b) continue;
        wave.push({ type, ...this.tilePos(rng.pick(free)) }); b -= c;
      }
      r.waves.push(wave);
    }
  },
  tilePos([x, y]) { return { x: x * T + T / 2, y: y * T + T / 2 }; },

  // ---------- run setup ----------
  startFloor(f, keepPlayers) {
    this.gen(f);
    this.enemies = []; this.projs = []; this.parts = []; this.pickups = []; this.bolts = []; this.texts = [];
    this.locked = false; this.waves = []; this.boss = null; this.room = null;
    const s = this.rooms[0];
    if (!keepPlayers) this.players = [this.makePlayer(0)];
    for (const p of this.players) { p.x = s.mx * T + T / 2; p.y = s.my * T + T / 2; p.vx = p.vy = 0; }
    Render.snapCamera();

    Music.target = 0;
  },
  makePlayer(slot) {
    const sr = RNG(hash(Game.seedNum, 0, 11));
    const st = { speed: 155, rollCd: 0.42, dmg: Game.mods.glass ? 3 : 1, meleeDmg: 1, rate: 1, extraShots: 0, bounce: 0, reach: 1, homing: 0, reflect: false, addElem: new Set() };
    const hp = Game.mods.glass ? 2 : 6 + (Meta.has('heart1') ? 2 : 0) + (Meta.has('heart2') ? 2 : 0);
    const p = {
      slot, src: 'auto', x: 0, y: 0, r: 9, vx: 0, vy: 0, hp, maxHp: hp, inv: 0, roll: 0, rollCd: 0, rdx: 1, rdy: 0, aim: 0,
      weapons: [
        makeWeapon(sr, { type: 'sword', rarity: Game.mods.allLegendary ? 3 : 0, elem: 'none', name: Game.mods.allLegendary ? undefined : 'Worn Blade' }),
        makeWeapon(sr, { type: 'bow', rarity: Game.mods.allLegendary ? 3 : Meta.has('fletcher') ? 1 : 0, name: Game.mods.allLegendary || Meta.has('fletcher') ? undefined : 'Hunter\'s Bow' }),
      ],
      wi: 0, cd: 0, charge: 0, echo: 0, swings: [], items: [], syn: [], st,
      hooks: { shoot: [], hit: [], kill: [], roll: [], hurt: [], clear: [] },
      revives: 0, kills: 0, embers: 0, dead: false, color: '#ffe9c4', swingDir: 1,
    };

    return p;
  },

  // ---------- tiles & collision ----------
  tile(x, y) { const tx = Math.floor(x / T), ty = Math.floor(y / T); if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return VOID; return this.map[ty * MW + tx]; },
  solidAt(x, y) { return solidT(this.tile(x, y)); },
  resolve(e) {
    let hit = false;
    const x0 = Math.floor((e.x - e.r) / T), x1 = Math.floor((e.x + e.r) / T), y0 = Math.floor((e.y - e.r) / T), y1 = Math.floor((e.y + e.r) / T);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (tx < 0 || ty < 0 || tx >= MW || ty >= MH || solidT(this.map[ty * MW + tx])) {
        const cx = clamp(e.x, tx * T, tx * T + T), cy = clamp(e.y, ty * T, ty * T + T);
        let dx = e.x - cx, dy = e.y - cy; const dd = dx * dx + dy * dy;
        if (dd < e.r * e.r) {
          hit = true;
          if (dd > 0.0001) { const d = Math.sqrt(dd), push = e.r - d; e.x += dx / d * push; e.y += dy / d * push; }
          else { // center inside tile: push out along shortest axis
            const l = e.x - tx * T, r = tx * T + T - e.x, u = e.y - ty * T, b = ty * T + T - e.y, m = Math.min(l, r, u, b);
            if (m === l) e.x -= l + e.r; else if (m === r) e.x += r + e.r; else if (m === u) e.y -= u + e.r; else e.y += b + e.r;
          }
        }

    }
    return hit;
  },
  move(e, dx, dy) {
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6));
    let hit = false;
    for (let i = 0; i < n; i++) { e.x += dx / n; if (this.resolve(e)) hit = true; e.y += dy / n; if (this.resolve(e)) hit = true; }
    return hit;
  },
  los(x0, y0, x1, y1) {
    const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 12);
    for (let i = 1; i < n; i++) { const t = i / n; if (this.solidAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false; }
    return true;
  },
  roomAt(x, y, m = 0.6) {
    const tx = x / T, ty = y / T;
    for (const r of this.rooms) if (tx >= r.x + m && tx <= r.x + r.w - m && ty >= r.y + m && ty <= r.y + r.h - m) return r;
    return null;
  },
  freeSpot(x, y) {
    if (!this.solidAt(x, y) && this.tile(x, y) !== DOOR) return { x, y };
    for (let rad = 1; rad < 6; rad++) for (let a = 0; a < 8; a++) {
      const px = x + Math.cos(a * TAU / 8) * rad * T, py = y + Math.sin(a * TAU / 8) * rad * T;
      if (!this.solidAt(px, py)) return { x: Math.floor(px / T) * T + T / 2, y: Math.floor(py / T) * T + T / 2 };
    }
    return { x, y };
  },
  // BFS flow field toward the player within the current room
  buildFlow(p) {
    const r = this.room; if (!r) return;
    const ptx = Math.floor(p.x / T), pty = Math.floor(p.y / T), k = pty * MW + ptx;
    if (k === this.flowKey) return; this.flowKey = k;
    const f = this.flow; f.fill(-1);
    const x0 = r.x - 1, x1 = r.x + r.w, y0 = r.y - 1, y1 = r.y + r.h;
    const q = [k]; f[k] = 0;
    for (let qi = 0; qi < q.length; qi++) {
      const i = q[qi], x = i % MW, y = (i - x) / MW;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy; if (nx < x0 || nx > x1 || ny < y0 || ny > y1) continue;
        const j = ny * MW + nx; if (f[j] !== -1 || solidT(this.map[j])) continue;
        f[j] = f[i] + 1; q.push(j);
      }
    }
  },
  flowDir(e, p) {
    const tx = Math.floor(e.x / T), ty = Math.floor(e.y / T), i = ty * MW + tx, f = this.flow;
    if (!f || f[i] < 0 || d2(e.x, e.y, p.x, p.y) < 50 * 50 || (f[i] <= 3 && this.los(e.x, e.y, p.x, p.y))) return Math.atan2(p.y - e.y, p.x - e.x);

  },

  // ---------- update ----------
  update(dt) {
    this.time += dt;
    const p0 = this.players[0];
    for (const p of this.players) if (!p.dead) this.updPlayer(p, dt);
    this.updRooms();
    if (this.room && this.locked) { this.flowT -= dt; if (this.flowT <= 0) { this.flowT = 0.15; this.buildFlow(p0); } }
    for (const e of this.enemies) this.updEnemy(e, dt);
    // keep enemies from stacking
    const en = this.enemies;
    for (let i = 0; i < en.length; i++) for (let j = i + 1; j < en.length; j++) {
      const a = en[i], b = en[j]; if (a.dead || b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, dd = dx * dx + dy * dy;
      if (dd < rr * rr && dd > 0.01) { const d = Math.sqrt(dd), push = (rr - d) / 2, nx = dx / d, ny = dy / d; const wa = a.boss ? 0 : 1, wb = b.boss ? 0 : 1; a.x -= nx * push * wa; a.y -= ny * push * wa; b.x += nx * push * wb; b.y += ny * push * wb; }
    }
    this.enemies = this.enemies.filter(e => !e.dead);
    this.updProjs(dt);
    this.updPickups(dt);
    for (const s of this.parts) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; const k = Math.exp(-(s.drag || 3) * dt); s.vx *= k; s.vy *= k; }
    this.parts = this.parts.filter(s => s.life > 0);
    if (this.parts.length > 800) this.parts.splice(0, this.parts.length - 800);
    for (const b of this.bolts) b.life -= dt; this.bolts = this.bolts.filter(b => b.life > 0);
    for (const t of this.texts) { t.life -= dt; t.y -= 30 * dt; } this.texts = this.texts.filter(t => t.life > 0);
    // waves
    if (this.locked && this.waves.length) {
      this.waveT -= dt;
      const alive = this.enemies.filter(e => !e.boss).length;
      if (alive <= 1 && this.waveT <= 0) this.spawnWave(this.waves.shift());
    }
    if (this.locked && !this.waves.length && !this.enemies.length) this.clearRoom();
  },

  updPlayer(p, dt) {
    const inp = Input.read(p.src, p);
    p.inp = inp;
    if (inp.aim !== null) p.aim = inp.assist ? this.assist(p, inp.aim) : inp.aim;
    else if (inp.device !== 'kb' && (inp.mx || inp.my) && !p.charge) p.aim = Math.atan2(inp.my, inp.mx);
    p.inv -= dt; p.rollCd -= dt;
    if (p.roll > 0) {
      p.roll -= dt;
      const sp = 340 * (p.roll > 0.12 ? 1 : 0.6);
      this.move(p, p.rdx * sp * dt, p.rdy * sp * dt);
      if (R.chance(0.6)) this.part(p.x, p.y, R.range(-20, 20), R.range(-20, 20), 0.35, 3, '#bfe3ff');
    } else {
      if (inp.roll && p.rollCd <= 0) {
        let dx = inp.mx, dy = inp.my; if (!dx && !dy) { dx = Math.cos(p.aim); dy = Math.sin(p.aim); }
        const l = Math.hypot(dx, dy); p.rdx = dx / l; p.rdy = dy / l;
        p.roll = 0.34; p.rollCd = p.st.rollCd + 0.34; p.charge = 0;
        Snd.play('roll'); for (const h of p.hooks.roll) h();
      }
      const sp = p.st.speed * (p.charge > 0 ? 0.68 : 1);
      const k = 1 - Math.exp(-18 * dt);
      p.vx = lerp(p.vx, inp.mx * sp, k); p.vy = lerp(p.vy, inp.my * sp, k);
      this.move(p, p.vx * dt, p.vy * dt);
    }
    if (inp.swap && p.weapons.length > 1) { p.wi = 1 - p.wi; p.charge = 0; p.cd = Math.max(p.cd, 0.1); Snd.play('ui'); }
    if (inp.use) this.interact(p);
    for (const s of p.swings) s.t += dt; p.swings = p.swings.filter(s => s.t < s.dur + 0.1);
    // weapons
    const w = p.weapons[p.wi];
    p.cd -= dt;
    if (p.echo > 0) { p.echo -= dt; if (p.echo <= 0) this.swing(p, p.echoW, true); }
    if (p.roll > 0) { p.charge = 0; return; }
    if (w.type === 'sword') {
      if (inp.attack && p.cd <= 0) { this.swing(p, w); p.cd = w.cd / p.st.rate; if (hasQ(w, 'echo')) { p.echo = 0.13; p.echoW = w; } }
    } else if (w.type === 'bow') {
      if (inp.attack && p.cd <= 0) {
        const prev = p.charge; p.charge = Math.min(1, Math.max(0.001, p.charge + dt * p.st.rate / w.charge));
        if (prev < 1 && p.charge >= 1) { Snd.play('charge'); for (let i = 0; i < 8; i++) this.part(p.x, p.y, Math.cos(i * TAU / 8) * 60, Math.sin(i * TAU / 8) * 60, 0.3, 2.5, ELEM[w.elem].c, true); }
      } else if (p.charge > 0) { this.fireBow(p, w); p.charge = 0; p.cd = w.cd / p.st.rate; }
    } else if (w.type === 'staff') {
      if (inp.attack && p.cd <= 0) { this.fireStaff(p, w); p.cd = w.cd / p.st.rate; }
    }
  },
  assist(p, a) { // touch/pad aim assist: snap toward a foe inside a 26° cone
    let best = null, bd = 1e9;
    for (const e of this.enemies) {
      if (e.dead || e.spawnT > 0) continue;
      const ea = Math.atan2(e.y - p.y, e.x - p.x), dd = d2(p.x, p.y, e.x, e.y);
      if (Math.abs(angDiff(a, ea)) < 0.45 && dd < 500 * 500 && dd < bd) { bd = dd; best = ea; }
    }
    return best === null ? a : best;
  },
  shotCount(p, w) { return 1 + p.st.extraShots + (hasQ(w, 'twin') ? 1 : 0); },
  mkProj(p, w, a, o) {
    const pr = Object.assign({
      x: p.x + Math.cos(a) * 12, y: p.y + Math.sin(a) * 12, owner: 'p', life: 1.1, pierce: hasQ(w, 'pierce') ? 1 : 0,
      bounce: p.st.bounce, elem: w.elem, homing: p.st.homing + (hasQ(w, 'seeking') ? 2.5 : 0) + (w.elem === 'arcane' ? 1.2 : 0),
      hit: new Set(), depth: 0, p, leech: hasQ(w, 'leech'), color: ELEM[w.elem].c,
    }, o);
    pr.vx = Math.cos(a) * o.speed; pr.vy = Math.sin(a) * o.speed;
    for (const h of p.hooks.shoot) h(pr);
    this.projs.push(pr); return pr;
  },
  fireBow(p, w) {
    const c = p.charge, full = c >= 1, n = this.shotCount(p, w);
    for (let i = 0; i < n; i++) {
      const a = p.aim + (i - (n - 1) / 2) * 0.1;
      this.mkProj(p, w, a, { speed: w.speed * (0.55 + 0.45 * c), r: full ? 5 : 4, kind: 'arrow', life: 1.3, dmg: w.dmg * p.st.dmg * (0.3 + 0.7 * c) * (full ? 1.3 : 1), pierce: (full ? 1 : 0) + (hasQ(w, 'pierce') ? 1 : 0), full });
    }
    Snd.play('arrow'); Render.kick(full ? 3 : 1);
  },
  fireStaff(p, w) {
    const n = this.shotCount(p, w);
    for (let i = 0; i < n; i++) {
      const a = p.aim + (i - (n - 1) / 2) * 0.16 + R.range(-w.spread, w.spread);
      this.mkProj(p, w, a, { speed: w.speed, r: 5, kind: 'bolt', life: 1.0, dmg: w.dmg * p.st.dmg });
    }
    Snd.play('bolt');
  },
  swing(p, w, echo) {
    const reach = w.reach * p.st.reach, arc = w.arc, a = p.aim;
    const dmg = w.dmg * p.st.dmg * p.st.meleeDmg * (echo ? 0.6 : 1);
    p.swingDir = -p.swingDir;
    p.swings.push({ a, arc, reach, t: 0, dur: 0.15, color: ELEM[w.elem].c, dir: p.swingDir });
    Snd.play('swing');
    const src = { melee: true, dmg, elem: w.elem, x: p.x, y: p.y, depth: 0, p, leech: hasQ(w, 'leech') };
    let any = false;
    for (const e of this.enemies) {
      if (e.dead || e.spawnT > 0) continue;
      const dd = Math.sqrt(d2(p.x, p.y, e.x, e.y));
      if (dd <= reach + e.r && (Math.abs(angDiff(a, Math.atan2(e.y - p.y, e.x - p.x))) <= arc / 2 || dd < e.r + p.r + 8)) { this.damage(e, dmg, src); any = true; }
    }
    for (const pr of this.projs) {
      if (pr.owner !== 'e' || pr.dead) continue;
      const dd = Math.sqrt(d2(p.x, p.y, pr.x, pr.y));
      if (dd <= reach + pr.r + 4 && Math.abs(angDiff(a, Math.atan2(pr.y - p.y, pr.x - p.x))) <= arc / 2 + 0.25) {
        if (p.st.reflect) {
          const sp = Math.hypot(pr.vx, pr.vy) * 1.6, na = Math.atan2(pr.y - p.y, pr.x - p.x);
          Object.assign(pr, { owner: 'p', vx: Math.cos(na) * sp, vy: Math.sin(na) * sp, dmg: dmg * 0.7, color: '#bfe3ff', elem: 'none', hit: new Set(), depth: 1, p, life: 1, pierce: 0, bounce: 0, homing: 1.5, kind: 'bolt' });
        } else pr.dead = true;
        this.burst(pr.x, pr.y, 6, '#ffffff', 120, 0.25); Snd.play('deflect');
      }
    }
    if (hasQ(w, 'wave')) this.mkProj(p, w, a, { speed: 380, r: 13, kind: 'wave', life: 0.42, dmg: dmg * 0.6, pierce: 99, bounce: 0, homing: 0 });
    if (any) { Game.hitstop(0.035); Render.kick(2.5); }
  },

  // ---------- damage & effects ----------
  damage(e, dmg, src) {
    if (e.dead || e.spawnT > 0) return;
    const p = src.p || this.players[0];
    if (e.type === 'knight' && e.shield && !src.aoe) {
      const from = src.proj ? Math.atan2(-src.proj.vy, -src.proj.vx) : Math.atan2(src.y - e.y, src.x - e.x);
      if (Math.abs(angDiff(e.face, from)) < 1.1) { dmg *= src.melee ? 0.35 : 0.12; this.burst(e.x + Math.cos(e.face) * e.r, e.y + Math.sin(e.face) * e.r, 5, '#9fb4ff', 140, 0.2); Snd.play('deflect'); }
    }
    e.hp -= dmg; e.flash = 0.09;
    // knockback
    let kx, ky;
    if (src.proj) { const l = Math.hypot(src.proj.vx, src.proj.vy) || 1; kx = src.proj.vx / l; ky = src.proj.vy / l; }
    else { const l = Math.hypot(e.x - src.x, e.y - src.y) || 1; kx = (e.x - src.x) / l; ky = (e.y - src.y) / l; }
    const kb = (src.melee ? 260 : 90) * (e.boss ? 0.05 : e.type === 'knight' ? 0.4 : 1);
    e.kx += kx * kb; e.ky += ky * kb;
    this.burst(e.x, e.y, 3, e.D.c, 110, 0.3);
    Snd.play('hit');
    // elements from the weapon plus any items that add elements
    const depth = src.depth || 0;
    const elems = new Set([src.elem]);
    if (depth === 0 || src.shard) for (const el of p.st.addElem) elems.add(el);
    if (src.extraElem) elems.add(src.extraElem);
    if (elems.has('fire')) { e.burn = 2.6; e.burnDmg = Math.max(e.burnDmg || 0, 3 * p.st.dmg); }
    if (elems.has('frost')) { e.chill = 1.8; if (R.chance(e.boss ? 0.02 : 0.12)) e.freeze = 1.1; }
    if (elems.has('storm') && depth < 2 && R.chance(0.3)) this.chain(e, dmg * 0.5, depth + 1, p);
    if (this.hasSyn('steam') && e.burn > 0 && e.chill > 0 && !src.steam && depth < 3) {
      e.burn = 0; e.chill = 0; this.explode(e.x, e.y, 60, dmg * 0.9 + 8 * p.st.dmg, depth + 1, '#e8f6ff', { steam: true });
    }
    if (depth <= 1 && !src.burn) for (const h of p.hooks.hit) h(e, src);
    if (e.hp <= 0) this.kill(e, src);
  },
  kill(e, src) {
    if (e.dead) return; e.dead = true;
    const p = src.p || this.players[0];
    this.burst(e.x, e.y, e.boss ? 80 : 18, e.D.c, e.boss ? 320 : 200, 0.6);
    this.burst(e.x, e.y, 8, '#ffffff', 120, 0.3);
    Snd.play('kill'); Render.kick(e.boss ? 14 : 3);
    p.kills++; Meta.data.stats.kills++;
    const em = Math.round((e.boss ? 12 * this.floor : e.D.embers) * (Game.mods.emberMult || 1));
    for (let i = 0; i < em; i++) this.pickups.push({ kind: 'ember', x: e.x, y: e.y, vx: R.range(-120, 120), vy: R.range(-120, 120), t: 0 });
    if (!e.boss && !e.minion && R.chance(0.035)) this.pickups.push({ kind: 'half', x: e.x, y: e.y, t: 0 });
    if (e.D.split && !e.boss) for (let i = 0; i < 2; i++) { const s = this.makeEnemy(e.D.split, e.x + R.range(-8, 8), e.y + R.range(-8, 8)); s.spawnT = 0; s.kx = R.range(-200, 200); s.ky = R.range(-200, 200); this.enemies.push(s); }
    if (src.leech && R.chance(0.08)) this.heal(1);
    for (const h of p.hooks.kill) h(e, src);
    if (e.boss) this.bossDown(e);
  },
  heal(n) {
    const p = this.players[0]; if (p.hp >= p.maxHp) return;
    p.hp = Math.min(p.maxHp, p.hp + n); Snd.play('heart');
    this.text(p.x, p.y - 20, '+' + (n / 2) + '♥', '#ff5470');
  },
  explode(x, y, rad, dmg, depth, color, extra = {}) {
    this.burst(x, y, 26, color, rad * 3.2, 0.45);
    this.parts.push({ x, y, vx: 0, vy: 0, life: 0.25, max: 0.25, size: rad, color, glow: true, ring: true });
    Snd.play('explode'); Render.kick(5);
    for (const e of this.enemies) if (!e.dead && d2(x, y, e.x, e.y) < (rad + e.r) ** 2) this.damage(e, dmg, { x, y, depth, aoe: true, elem: 'none', ...extra });
  },
  chain(from, dmg, depth, p, x = from.x, y = from.y) {
    let n = 0;
    const tg = this.enemies.filter(e => e !== from && !e.dead && e.spawnT <= 0 && d2(x, y, e.x, e.y) < 140 * 140).sort((a, b) => d2(x, y, a.x, a.y) - d2(x, y, b.x, b.y));
    for (const e of tg) { if (n++ >= 2) break; this.bolts.push({ x1: x, y1: y, x2: e.x, y2: e.y, life: 0.14, seed: R() * 1000 }); this.damage(e, dmg, { x, y, depth, elem: 'none', p }); }
    if (n) Snd.play('zap');
  },
  ring(x, y, n, dmg, elem) {
    const p = this.players[0], w = { elem, quirks: [] };
    for (let i = 0; i < n; i++) {
      const a = i * TAU / n + R() * 0.2;
      const pr = this.mkProj(p, w, a, { speed: 300, r: 4, kind: 'spark', life: 0.45, dmg, depth: 1, homing: 0, bounce: 0, pierce: 0 });
      if (this.hasSyn('cinderwake') && elem === 'storm') pr.extraElem = 'fire';
    }
  },

  draw(dt) {

    const stick = (st, hx, hy) => {
      const x = st ? st.ox : hx, y = st ? st.oy : hy;
      c.strokeStyle = `rgba(233,228,255,${st ? 0.35 : 0.12})`; c.lineWidth = 2; c.beginPath(); c.arc(x, y, max, 0, TAU); c.stroke();
      if (st) { const v = Input.stickVec(st, max); c.fillStyle = 'rgba(255,200,140,0.45)'; c.beginPath(); c.arc(x + v.x * max, y + v.y * max, max * 0.42, 0, TAU); c.fill(); }
    };
    stick(Input.sticks.L, W * 0.16, H * 0.6); stick(Input.sticks.R, W * 0.62, H * 0.62);
    for (const b of Input.touchButtons()) {
      if (b.id === 'use' && !World.near) continue;
      if (b.id === 'swap' && World.players[0].weapons.length < 2) continue;
      c.fillStyle = b.id === 'use' ? 'rgba(255,176,87,0.35)' : 'rgba(40,28,80,0.55)'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(233,228,255,0.4)'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#f4eeff'; c.textAlign = 'center'; c.font = `800 ${Math.round(b.r * 0.42)}px ui-rounded, system-ui, sans-serif`;
      c.fillText({ roll: 'ROLL', swap: 'SWAP', use: 'TAKE', pause: 'II' }[b.id], b.x, b.y + b.r * 0.15);
    }
  },
};
function fitText(c, s, w) { if (c.measureText(s).width <= w) return s; while (s.length > 3 && c.measureText(s + '…').width > w) s = s.slice(0, -1); return s + '…'; }
function weaponLine(w) {
  const dmg = Math.round(w.dmg * (w.type === 'staff' ? 1 : 1));
  const spd = (1 / w.cd).toFixed(1);
  const el = w.elem !== 'none' ? ' · ' + w.elem : '';
  return w.type === 'bow' ? `${dmg} dmg · ${w.charge.toFixed(2)}s draw${el}` : `${dmg} dmg · ${spd}/s${el}`;
}

// ===== Game: state, runs, menus =====
const Game = {
  state: 'menu', seed: '', seedNum: 0, mods: {}, secret: null, hs: 0, runEmbers: 0, runTime: 0, bannerData: null, deadT: 0,
  maxFloor() { return Meta.has('deep') ? 4 : 3; },
  hitstop(t) { this.hs = Math.max(this.hs, t); },
  banner(title, sub, dur = 2) { this.bannerData = { title, sub, dur, t: 0 }; },
  newRun(seedStr) {
    Snd.init();
    this.seed = normSeed(seedStr) || randomSeed();
    this.seedNum = strHash(this.seed);
    const sec = SECRETS[this.seedNum];
    this.secret = sec || null; this.mods = sec ? { ...sec.mods } : {};
    this.runEmbers = 0; this.runTime = 0; this.deadT = 0; this.hs = 0;
    Meta.data.stats.runs++; Meta.save();
    Music.setSeed(this.seedNum); Music.on = true;
    World.startFloor(1);
    if (sec) {
      const first = !Meta.data.secrets[this.seed];
      if (first) { Meta.data.secrets[this.seed] = sec.n; Meta.data.embers += 25; Meta.save(); }
      setTimeout(() => this.banner('Secret Seed: ' + sec.n, sec.d + (first ? '  (+25 embers)' : ''), 3.4), 2700);
    }
    this.state = 'play'; Menu.hide();
  },
  nextFloor(last) {
    if (last) { this.end(true); return; }
    World.startFloor(World.floor + 1, true);
  },
  onDeath() { this.deadT = 1.4; Music.target = 0; },
  end(won) {
    this.state = won ? 'win' : 'dead';
    Meta.data.embers += this.runEmbers;
    Meta.data.stats.bestFloor = Math.max(Meta.data.stats.bestFloor, World.floor);
    if (won) Meta.data.stats.wins++;
    Meta.save(); Music.on = false;
    Snd.play(won ? 'portal' : 'death');
    Menu.show(won ? 'win' : 'dead');
  },
  togglePause() {
    if (this.state === 'play') { this.state = 'pause'; Menu.show('pause'); }
    else if (this.state === 'pause') { this.state = 'play'; Menu.hide(); }
  },
  saveSeed() {
    const list = Meta.data.seeds.filter(s => s.seed !== this.seed);
    list.unshift({ seed: this.seed, date: new Date().toLocaleDateString(), floor: World.floor, won: this.state === 'win', secret: this.secret ? this.secret.n : '' });
    Meta.data.seeds = list.slice(0, 40); Meta.save();
  },
  frame(ts) {
    const dt = Math.min(0.05, (ts - (this.last || ts)) / 1000); this.last = ts;
    if (Input.pressed.has('escape') || Input.pressed.has('p')) this.togglePause();
    if (Input.pressed.has('m')) Snd.setMuted(!Meta.data.muted);
    let rdt = 0;
    if (this.state === 'play') {
      rdt = dt;
      if (this.hs > 0) { this.hs -= dt; rdt = dt * 0.15; }
      else { World.update(dt); this.runTime += dt; }
      if (this.deadT > 0) { this.deadT -= dt; if (this.deadT <= 0) this.end(false); }
    }
    if (World.map) Render.draw(rdt); else Menu.drawBg(dt);
    Input.endFrame();
    requestAnimationFrame(t => this.frame(t));
  },
};

const Menu = {
  el: null, bg: [],
  hide() { this.el.classList.add('hidden'); this.el.innerHTML = ''; },
  drawBg(dt) {
    const c = Render.c, W = Render.W, H = Render.H;
    c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#07050f'; c.fillRect(0, 0, W, H);
    if (this.bg.length < 90) this.bg.push({ x: Math.random() * W, y: H + 10, v: 20 + Math.random() * 60, s: 1 + Math.random() * 3, w: Math.random() * TAU });
    c.globalCompositeOperation = 'lighter';
    for (const b of this.bg) { b.y -= b.v * dt * Render.dpr; b.w += dt; b.x += Math.sin(b.w) * 0.3; if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; } Render.drawGlow('#ff7a2a', b.x, b.y, b.s * 6 * Render.dpr, 0.5); }
    c.globalCompositeOperation = 'source-over';
  },
  html(h) { this.el.innerHTML = `<div class="panel">${h}</div>`; this.el.classList.remove('hidden'); },
  on(id, fn) { const b = document.getElementById(id); if (b) b.onclick = () => { Snd.init(); Snd.play('ui'); fn(); }; },
  show(name) {
    const M = Meta.data, ctrl = matchMedia('(pointer:coarse)').matches
      ? 'Left thumb moves. Right thumb aims and attacks (hold to draw a bow, let go to fire).'
      : 'WASD move · Mouse aim · Click attack (hold to draw a bow) · Space or right-click roll · Q swap · E take · Esc pause · M mute';
    if (name === 'title') {
      Game.state = 'menu';
      this.html(`<h1>EMBERDEEP</h1><div class="sub">A tiny procedural dungeon. Every seed is a different descent.</div>
        <button class="btn" id="b-new">New Run</button>
        <button class="btn" id="b-seed">Enter a Seed</button>
        <div class="row"><button class="btn" id="b-saved">Saved Seeds</button><button class="btn" id="b-sanct">Sanctum · <span class="ember">${M.embers}</span></button></div>
        <button class="btn small" id="b-mute">${M.muted ? 'Sound: Off' : 'Sound: On'}</button>
        <div class="hint">${ctrl}<br>Rolling makes you untouchable. Swords swat shots out of the air.</div>`);
      this.on('b-new', () => Game.newRun());
      this.on('b-seed', () => this.show('seed'));
      this.on('b-saved', () => this.show('saved'));
      this.on('b-sanct', () => this.show('sanctum'));
      this.on('b-mute', () => { Snd.setMuted(!M.muted); this.show('title'); });
    } else if (name === 'seed') {
      this.html(`<h2>Enter a Seed</h2><div class="sub">Same seed, same dungeon. Some seeds hold secrets.</div>
        <input class="seed" id="seedin" maxlength="16" placeholder="${randomSeed()}" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn" id="b-go">Descend</button><button class="btn small" id="b-back">Back</button>`);
      const inp = document.getElementById('seedin'); setTimeout(() => inp.focus(), 50);
      inp.onkeydown = e => { if (e.key === 'Enter') Game.newRun(inp.value || inp.placeholder); };
      this.on('b-go', () => Game.newRun(inp.value || inp.placeholder));
      this.on('b-back', () => this.show('title'));
    } else if (name === 'saved') {
      const rows = M.seeds.map((s, i) => `<div class="card"><div class="grow"><b>${s.seed}</b>${s.secret ? ` <span class="secret">· ${s.secret}</span>` : ''}<small>${s.won ? 'Escaped' : 'Reached floor ' + s.floor} · ${s.date}</small></div><button class="btn" id="play-${i}">Play</button><button class="btn" id="del-${i}">✕</button></div>`).join('');
      this.html(`<h2>Saved Seeds</h2><div class="list">${rows || '<div class="sub">No saved seeds yet. Save one from the pause menu or after a run.</div>'}</div><button class="btn small" id="b-back">Back</button>`);
      M.seeds.forEach((s, i) => { this.on('play-' + i, () => Game.newRun(s.seed)); this.on('del-' + i, () => { M.seeds.splice(i, 1); Meta.save(); this.show('saved'); }); });
      this.on('b-back', () => this.show('title'));
    } else if (name === 'sanctum') {
      const rows = UNLOCKS.map(u => {
        const own = Meta.has(u.id), locked = u.req && !Meta.has(u.req);
        return `<div class="card"><div class="grow"><b>${u.n}</b><small>${locked ? 'Requires ' + UNLOCKS.find(x => x.id === u.req).n : u.d}</small></div>${own ? '<span class="ember">✓</span>' : `<button class="btn" id="u-${u.id}" ${M.embers < u.cost || locked ? 'disabled' : ''}>${u.cost} ◆</button>`}</div>`;
      }).join('');
      const found = Object.values(M.secrets);
      this.html(`<h2>The Sanctum</h2><div class="sub">You carry <span class="ember">${M.embers} embers</span>. Spend them to grow stronger between runs.</div>
        <div class="list">${rows}</div>
        <div class="hint">Secret seeds found: ${found.length} / ${Object.keys(SECRETS).length}${found.length ? ' · <span class="secret">' + found.join(', ') + '</span>' : ''}<br>Runs ${M.stats.runs} · Escapes ${M.stats.wins} · Deepest floor ${M.stats.bestFloor} · Foes slain ${M.stats.kills}</div>
        <button class="btn small" id="b-back">Back</button>`);
      for (const u of UNLOCKS) this.on('u-' + u.id, () => { if (M.embers >= u.cost) { M.embers -= u.cost; M.unlocks[u.id] = 1; Meta.save(); Snd.play('item'); this.show('sanctum'); } });
      this.on('b-back', () => this.show('title'));
    } else if (name === 'pause') {
      const p = World.players[0];
      const items = p.items.map(id => ITEMS.find(x => x.id === id)).map(it => `<div class="card"><div class="grow"><b style="color:${it.c}">${it.n}</b><small>${it.d}</small></div></div>`).join('');
      const syn = p.syn.map(id => SYNERGIES.find(s => s.id === id)).map(s => `<div class="card"><div class="grow"><b class="secret">✦ ${s.n}</b><small>${s.d}</small></div></div>`).join('');
      this.html(`<h2>Paused</h2><div class="sub">Seed <b>${Game.seed}</b> · Floor ${World.floor} · ${fmtTime(Game.runTime)}</div>
        <div class="list">${syn}${items || '<div class="sub">No items yet.</div>'}</div>
        <button class="btn" id="b-res">Resume</button>
        <div class="row"><button class="btn small" id="b-save">Save Seed</button><button class="btn small" id="b-mute">${M.muted ? 'Sound: Off' : 'Sound: On'}</button></div>
        <button class="btn small" id="b-quit">Abandon Run</button>`);
      this.on('b-res', () => Game.togglePause());
      this.on('b-save', () => { Game.saveSeed(); document.getElementById('b-save').textContent = 'Saved ✓'; });
      this.on('b-mute', () => { Snd.setMuted(!M.muted); document.getElementById('b-mute').textContent = M.muted ? 'Sound: Off' : 'Sound: On'; });
      this.on('b-quit', () => { Game.end(false); });
    } else if (name === 'dead' || name === 'win') {
      const p = World.players[0], won = name === 'win';
      this.html(`<h1 style="font-size:clamp(36px,7vw,60px)">${won ? 'ESCAPED' : 'FALLEN'}</h1>
        <div class="sub">${won ? 'You climbed out of the deep. It will be waiting.' : `Lost on ${FLOOR_NAMES[World.floor]}.`}</div>
        <div class="stats"><span>Seed</span><span>${Game.seed}</span><span>Floor reached</span><span>${World.floor}</span><span>Time</span><span>${fmtTime(Game.runTime)}</span><span>Foes slain</span><span>${p.kills}</span><span>Items</span><span>${p.items.length}</span><span>Embers banked</span><span class="ember">+${Game.runEmbers}</span></div>
        <button class="btn" id="b-again">Same Seed Again</button>
        <button class="btn" id="b-new">New Seed</button>
        <div class="row"><button class="btn small" id="b-save">Save Seed</button><button class="btn small" id="b-sanct">Sanctum · ${M.embers} ◆</button></div>
        <button class="btn small" id="b-title">Title</button>`);
      this.on('b-again', () => Game.newRun(Game.seed));
      this.on('b-new', () => Game.newRun());
      this.on('b-save', () => { Game.saveSeed(); document.getElementById('b-save').textContent = 'Saved ✓'; });
      this.on('b-sanct', () => { World.map = null; this.show('sanctum'); });
      this.on('b-title', () => { World.map = null; this.show('title'); });
    }
  },
};
function fmtTime(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// ===== Boot =====
Meta.load();
Render.init();
Input.init(Render.cv);
Menu.el = document.getElementById('menu');
Menu.el.addEventListener('pointerdown', () => Snd.init());
Menu.show('title');
requestAnimationFrame(t => Game.frame(t));
window.__emberdeep = { Game, World, Meta, Render };

</script>
</body>
</html>
